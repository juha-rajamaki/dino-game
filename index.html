  function openCard(id){
    var i = sideFor(id);
    state.sides[i].last = id;
    state.sides[i].open = true;
    renderFacts();
  }

  function renderFacts(){
    for(var i = 0; i < BOXES.length; i++) paintFacts(i);
    /* on a phone the left box is the sheet that slides up over the board */
    var sheetOpen = !BOXES[0].panel.hidden;
    document.body.dataset.card = sheetOpen ? "open" : "shut";
    cardsTab.setAttribute("aria-expanded", String(sheetOpen));
    renderPile();
  }

  function paintFacts(i){
    var panel = BOXES[i].panel;
    var box = BOXES[i].body;
    var playBtn = playBtns[i];
    var seat = (state.sides && state.sides[i]) || {last: null, open: false};
    box.textContent = "";
    /* the right box only exists once somebody sits there, and a phone has none */
    var inUse = (i === 0) || (state.players >= 2 && !oneSide.matches);
    if(!inUse) seat = {last: null, open: false};
    var dino = seat.last ? byId(seat.last) : null;
    /* whose card this is, so a shared box still says who found it */
    var by = dino ? finderOf(seat.last) : 0;
    if(by) panel.dataset.owner = String(by); else delete panel.dataset.owner;

    /* Only the side whose card is going loses its voice. A match on one side of
       the table must not cut off a card being read aloud on the other. */
    if(speakingSide === i && (!(dino && seat.open) || seat.last !== speakingId)) stopSpeech();

    /* Shut until a pair is found, and shut again when the card is put back. */
    panel.hidden = !(dino && seat.open);
    if(dino){ box.style.animation = "none"; void box.offsetWidth; box.style.animation = ""; }
    if(dino){
      var shot = document.createElement("img");
      shot.className = "portrait";
      shot.src = "img/" + dino.id + ".webp";
      shot.alt = dino.name;

      var name = document.createElement("p");
      name.className = "name";
      name.textContent = dino.name;

      var means = document.createElement("p");
      means.className = "means";
      means.textContent = dino.means;

      var NOTE = {
        "Pterosaur": "Pterosaur \u2014 a flying reptile, not a dinosaur",
        "Marine reptile": "Marine reptile \u2014 a giant sea lizard, not a dinosaur",
        "Plesiosaur": "Plesiosaur \u2014 a long-necked sea reptile, not a dinosaur"
      };
      var badge = null;
      if(dino.group && NOTE[dino.group]){
        badge = document.createElement("p");
        badge.className = "not-dino";
        badge.textContent = NOTE[dino.group];
      }

      /* the stats: how fast, how heavy, what it ate */
      var stats = document.createElement("div");
      stats.className = "stats";

      function meterRow(label, fraction, value){
        var row = document.createElement("div");
        row.className = "stat-row";
        var lab = document.createElement("span");
        lab.className = "lab"; lab.textContent = label;
        var bar = document.createElement("div");
        bar.className = "meter";
        var fill = document.createElement("span");
        fill.style.width = Math.max(4, Math.min(100, fraction * 100)) + "%";
        bar.appendChild(fill);
        var val = document.createElement("span");
        val.className = "val"; val.textContent = value;
        row.appendChild(lab); row.appendChild(bar); row.appendChild(val);
        return row;
      }

      stats.appendChild(meterRow("Speed", dino.speed / 62, dino.speed + " km/h"));
      stats.appendChild(meterRow("Weight", Math.sqrt(dino.tonnes / 70),
        dino.tonnes < 1 ? Math.round(dino.tonnes * 1000) + " kg" : dino.tonnes + " t"));

      var dietRow = document.createElement("div");
      dietRow.className = "stat-row";
      var dl2 = document.createElement("span");
      dl2.className = "lab"; dl2.textContent = "Ate";
      var pill = document.createElement("span");
      pill.className = "diet";
      pill.dataset.food = dino.food;
      pill.textContent = dino.food === "Meat"    ? "Meat \u2014 a hunter"
                       : dino.food === "Fish"    ? "Fish \u2014 a fisher"
                       : dino.food === "Insects"  ? "Insects \u2014 a bug catcher"
                       : dino.food === "Anything" ? "Anything \u2014 a nibbler"
                       : "Plants \u2014 a grazer";
      dietRow.appendChild(dl2); dietRow.appendChild(pill);
      stats.appendChild(dietRow);

      var rows = document.createElement("dl");
      rows.className = "rows";

      var per = document.createElement("span");
      per.className = "per";
      var dot = document.createElement("span");
      dot.className = "dot " + dino.period;
      per.appendChild(dot);
      per.appendChild(document.createTextNode(dino.period + ", " + dino.ago));

      [["Lived", per], ["Length", dino.size],
       ["Found in", dino.place]].forEach(function(row){
        var dt = document.createElement("dt"); dt.textContent = row[0];
        var dd = document.createElement("dd");
        if(typeof row[1] === "string") dd.textContent = row[1];
        else dd.appendChild(row[1]);
        rows.appendChild(dt); rows.appendChild(dd);
      });

      var fact = document.createElement("p");
      fact.className = "fact";
      fact.textContent = dino.fact;

      var nameRow = document.createElement("div");
      nameRow.className = "name-row";
      nameRow.appendChild(name);
      nameRow.appendChild(playBtn);

      var text = document.createElement("div");
      text.className = "facts-text";
      text.appendChild(nameRow);
      text.appendChild(means);
      if(badge) text.appendChild(badge);
      text.appendChild(stats);
      text.appendChild(rows);
      text.appendChild(fact);

      box.appendChild(shot);
      box.appendChild(text);
    }
  }

  var popped = {};   /* a badge pops in once, the first time it is drawn */

  /* who won a pair, read back off the deck the pair came from */
  function finderOf(id){
    for(var i = 0; i < state.deck.length; i++){
      if(state.deck[i].id === id) return state.deck[i].by || 0;
    }
    return 0;
  }

  /* On a wide screen the players sit across the table from each other and each
     one's cards lie on their own side: seats one and three to the left, two and
     four to the right. A phone has only one side, so everything stacks there,
     every pile first and then the one box. */
  /* the stylesheet's own query, word for word, so the two can never disagree */
  var oneSide = window.matchMedia("(max-width:980px), (orientation:portrait)");
  /* how many players sit on each side, which decides how the height is shared */
  function markSeats(){
    var narrow = oneSide.matches, n = (state && state.players) || 1;
    rail.dataset.seats = String(narrow ? 1 : Math.ceil(n / 2));
    rail2.dataset.seats = String(narrow ? 1 : Math.floor(n / 2));
  }

  function placeSeats(){
    var narrow = oneSide.matches;
    markSeats();
    if(narrow){
      /* one side of the table: the handle that puts it away, every pile,
         then the one box below them */
      rail.appendChild(sheetHide);
      SEATS.forEach(function(seat){ rail.appendChild(seat.pilePanel); });
      rail.appendChild(BOXES[0].panel);
      rail.appendChild(BOXES[1].panel);
      return;
    }
    /* Each side reads the way the two of them sit: the first player's cards,
       then the box they share, then the other player's cards below it. */
    rail.appendChild(SEATS[0].pilePanel);
    rail.appendChild(BOXES[0].panel);
    rail.appendChild(SEATS[2].pilePanel);
    rail2.appendChild(SEATS[1].pilePanel);
    rail2.appendChild(BOXES[1].panel);
    rail2.appendChild(SEATS[3].pilePanel);
  }
  if(oneSide.addEventListener) oneSide.addEventListener("change", placeSeats);
  else if(oneSide.addListener) oneSide.addListener(placeSeats);
  placeSeats();

  /* Every card you have collected, smallest first look, click to read it again. */
  function fillPile(seat, who){
    var grid = seat.pileGrid, panel = seat.pilePanel;
    grid.textContent = "";
    var mine = state.found.filter(function(id){ return !who || finderOf(id) === who; });
    panel.hidden = mine.length === 0;
    if(!mine.length) return;

    seat.pileCount.textContent = String(mine.length);
    mine.forEach(function(id){
      var dino = byId(id);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "pile-card";
      b.title = dino.name;
      b.setAttribute("aria-label", "Read about " + dino.name);
      if(!popped[id]){ b.className += " fresh"; popped[id] = true; }
      var seat = state.sides[sideFor(id)];
      if(seat.open && seat.last === id) b.dataset.open = "true";
      var im = document.createElement("img");
      im.src = "img/" + dino.id + ".webp";
      im.alt = "";
      b.appendChild(im);
      b.addEventListener("click", function(){
        sfx.flip();
        openCard(id);
      });
      grid.appendChild(b);
    });
  }

  function renderPile(){
    var many = state.players > 1;
    markSeats();
    var show = state.mode !== "album" && state.found.length > 0;
    cardsTab.hidden = !show;
    rail2.hidden = !(show && state.players >= 2);

    SEATS.forEach(function(seat, i){
      if(!show || i >= state.players){
        seat.pilePanel.hidden = true;
        seat.pileGrid.textContent = "";
        return;
      }
      seat.pileTitle.textContent = many ? "Player " + (i + 1) : "Your cards";
      if(many) seat.pilePanel.dataset.owner = String(i + 1);
      else delete seat.pilePanel.dataset.owner;
      fillPile(seat, many ? i + 1 : 0);
    });
  }

  /* Who has won: most pairs, and anybody who let their clock run out cannot,
     however far ahead they were. More than one on top is a tie. */
  function standings(){
    var best = -1, winners = [];
    for(var i = 0; i < state.players; i++){
      if(state.timeout === i) continue;
      if(state.scores[i] > best){ best = state.scores[i]; winners = [i]; }
      else if(state.scores[i] === best) winners.push(i);
    }
    return {best: best, winners: winners};
  }

  function recordBest(){
    var all = loadBest(), total = scoreOf(state).total, prev = all[state.pairs];
    if(!prev || total > prev.score){
      all[state.pairs] = {score: total, seconds: state.seconds, turns: state.turns};
      saveBest(all);
      state.newBest = true;
    }
  }

  function renderBanner(){
    bannerSlot.textContent = "";
    /* won or lost, the game is over: the board steps back and the animals
       come forward over the cards again */
    document.body.dataset.won = String(!!state.won);
    if(state.won) delete board.dataset.forward;
    /* put away, so the finished board can be looked over */
    if(!state.won || state.bannerShut) return;

    var banner = document.createElement("div");
    banner.className = "banner";

    var shut = document.createElement("button");
    shut.type = "button"; shut.className = "close-x";
    shut.textContent = "\u00D7";
    shut.setAttribute("aria-label", "Close");
    shut.addEventListener("click", function(){
      state.bannerShut = true;
      renderBanner();
      live.textContent = "The board is yours to look at. New game starts another.";
    });
    banner.appendChild(shut);
    var h = document.createElement("h2");
    var p = document.createElement("p");

    banner.appendChild(h);

    if(state.players >= 2){
      var st = standings(), won = st.winners;
      h.textContent = won.length === 1 ? "Player " + (won[0] + 1) + " wins!" : "It's a tie!";
      if(won.length === 1) banner.dataset.win = String(won[0] + 1);

      /* The plates along the top already carry everybody's number, so the
         banner says the thing a child wants to hear: who won, and with how
         many animals. */
      var animals = st.best + (st.best === 1 ? " dinosaur" : " dinosaurs");
      var said;
      if(won.length === 1){
        said = "Player " + (won[0] + 1) + " wins with " + animals + ".";
      } else if(won.length === state.players){
        said = (state.players === 2 ? "Both found " : "Everybody found ") + animals + ".";
      } else {
        var names = won.map(function(i){ return "Player " + (i + 1); });
        said = names.slice(0, -1).join(", ") + " and " + names[names.length - 1] +
               " both found " + animals + ".";
        if(names.length > 2) said = said.replace(" both found ", " all found ");
      }
      p.textContent = (state.timeout !== null && state.timeout !== undefined
          ? "Player " + (state.timeout + 1) + " ran out of time. " : "") +
        said + " It took " + timeText(state.seconds) + ".";
      banner.appendChild(p);
    } else if(state.timeout !== null && state.timeout !== undefined){
      h.textContent = "Time's up!";
      p.textContent = "You found " + state.found.length + " of " + state.pairs +
                      " pairs. Try again - you can beat the clock!";
      banner.appendChild(p);
    } else {
      h.textContent = "You found them all!";
      var stars = starsOf(state), sc = scoreOf(state);

      var row = document.createElement("div");
      row.className = "stars";
      for(var i = 0; i < 3; i++){
        var st = document.createElement("span");
        st.className = "s" + (i < stars ? " on" : "");
        st.textContent = "\u2605";
        row.appendChild(st);
      }
      banner.appendChild(row);

      var big = document.createElement("p");
      big.className = "final-score";
      big.textContent = sc.total.toLocaleString();
      var cap = document.createElement("small");
      cap.textContent = "points";
      big.appendChild(cap);
      banner.appendChild(big);

      p.textContent = timeText(state.seconds) + " · " + state.turns + " turns · " +
                      Math.round(sc.accuracy * 100) + "% right";
      banner.appendChild(p);

      var best = loadBest()[state.pairs];
      if(state.newBest){
        var nb = document.createElement("p");
        nb.className = "best-line";
        nb.textContent = "New best score!";
        banner.appendChild(nb);
      } else if(best){
        var bl = document.createElement("p");
        bl.className = "best-line";
        bl.textContent = "Your best: " + best.score.toLocaleString();
        banner.appendChild(bl);
      }
    }

    var again = document.createElement("button");
    again.type = "button"; again.className = "btn"; again.textContent = "Play again";
    again.addEventListener("click", function(){ newGame(); });
    banner.appendChild(again);
    bannerSlot.appendChild(banner);
    again.focus();
  }

  /* ---------- game ---------- */
  function clearFlipTimer(){
    if(state) state.holding = false;
    if(flipHandle){ clearTimeout(flipHandle); flipHandle = null; }
  }
  /* Two players share the board but not the clock: each has a budget of their
     own, and it only runs down while the turn is theirs. Run it out and the
     game is over, however many pairs you were ahead by. */
  function paintClocks(){
    if(!state || !state.clocks) return;
    /* alone, the countdown lives in the timer chip */
    if(state.players < 2){
      if(!timerValue) return;
      timerValue.textContent = timeText(state.clocks[0]);
      timerValue.parentNode.setAttribute("aria-label", timeText(state.clocks[0]) + " left");
      timerValue.parentNode.dataset.low = String(state.clocks[0] <= 30);
      return;
    }
    for(var i = 0; i < state.players; i++){
      if(!clockVal[i]) continue;
      clockVal[i].textContent = timeText(state.clocks[i]);
      clockVal[i].setAttribute("aria-label",
        "Player " + (i + 1) + " has " + timeText(state.clocks[i]) + " left");
      clockVal[i].parentNode.dataset.low = String(state.clocks[i] <= 30);
    }
  }

  function timeUp(){
    stopClock();
    clearFlipTimer();
    lock = true;
    state.won = true;
    state.timeout = state.turn;
    if(state.players < 2){
      live.textContent = "Time's up! You found " + state.found.length + " of " + state.pairs + " pairs.";
    } else {
      var st = standings();
      live.textContent = "Player " + (state.turn + 1) + " has run out of time. " +
        (st.winners.length === 1 ? "Player " + (st.winners[0] + 1) + " wins!" : "It's a tie!");
    }
    renderScore(); renderBanner();
    setTimeout(sfx.win, 260);
    setTimeout(sayWin, 1150);
  }

  function startClock(){
    if(state.running) return;
    state.running = true;
    tickHandle = setInterval(function(){
      state.seconds++;
      if(timerValue && !state.clocks) timerValue.textContent = timeText(state.seconds);
      /* nobody's clock runs while the two cards of a miss are still face up:
         the player who turned them is done, and the next one cannot move yet */
      if(state.clocks && !state.won && !state.holding){
        state.clocks[state.turn] = Math.max(0, state.clocks[state.turn] - 1);
        paintClocks();
        var left = state.clocks[state.turn];
        if(left > 0 && left <= 10) sfx.tick(left);
        if(state.clocks[state.turn] === 0) timeUp();
      }
      /* once a minute, and every half-minute through the last four of the
         clock that is running */
      var every = state.clocks && state.clocks[state.turn] <= 240 ? 30 : 60;
      var swapping = state.moving && !state.won && state.seconds % every === 0 && swapCards();
      /* each player hears it when their own clock is half gone */
      if(state.moving && !state.won && !state.holding && state.clocks &&
         state.clocks[state.turn] * 2 === state.budget){
        var half = (state.players >= 2 ? "Player " + (state.turn + 1) + ", half" : "Half") +
                   " your time is gone!";
        live.textContent = swapping ? live.textContent + " " + half : half;
        var game = state;
        /* after the swoosh, if a swap lands on the same second */
        setTimeout(function(){ if(state === game && !game.won) sfx.half(); }, swapping ? 1900 : 0);
      }
    }, 1000);
  }

  /* Extra hard, every minute of play (every half-minute near the end): two face-down cards get up and trade
     places, sliding past each other across the table, so what you remembered
     about them is no longer true. Only cards nobody is looking at move, and
     never two of the same animal - that would change nothing. One of the two
     is always a card that has been turned before, if there is one: moving a
     card nobody has seen takes nothing away from anybody. */
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  function swapCards(){
    var cards = board.querySelectorAll(".card");
    var free = state.deck.map(function(slot, i){ return i; }).filter(function(i){
      var el = cards[i];
      return el && !state.deck[i].matched && el.dataset.face === "down" &&
             !el.dataset.state && !el.dataset.moving;
    });
    free = shuffle(free);
    /* the first from the cards that have been seen, its partner from all the
       rest - two seen ones alone would only trade back and forth */
    var firsts = free.filter(function(i){ return state.deck[i].seen; }).concat(free);
    var a = null, b = null;
    for(var x = 0; x < firsts.length && b === null; x++)
      for(var y = 0; y < free.length; y++)
        if(free[y] !== firsts[x] && state.deck[firsts[x]].id !== state.deck[free[y]].id){ a = firsts[x]; b = free[y]; break; }
    if(b === null) return false;

    var game = state, elA = cards[a], elB = cards[b];
    sfx.swap();
    live.textContent = "Watch out! Two cards are swapping places.";

    function finish(){
      if(state !== game) return;
      /* the slots trade animals and the buttons trade faces; both are face
         down, so nothing seen changes as the cards settle into their new homes */
      var t = game.deck[a]; game.deck[a] = game.deck[b]; game.deck[b] = t;
      var innerA = elA.querySelector(".inner"), innerB = elB.querySelector(".inner");
      elA.appendChild(innerB); elB.appendChild(innerA);
      [elA, elB].forEach(function(el){
        el.getAnimations && el.getAnimations().forEach(function(an){ if(an.id === "swap") an.cancel(); });
        delete el.dataset.moving;
      });
    }

    elA.dataset.moving = elB.dataset.moving = "true";
    var ra = elA.getBoundingClientRect(), rb = elB.getBoundingClientRect();
    var dx = rb.left - ra.left, dy = rb.top - ra.top;
    if(reduceMotion.matches || !elA.animate){ setTimeout(finish, 900); return true; }

    /* each card bows out to its own side of the line between them, so the
       two pass each other instead of sliding through one another */
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var bow = Math.min(90, dist * 0.22);
    var nx = -dy / dist * bow, ny = dx / dist * bow;
    function path(fx, fy, sign){
      return [
        {transform: "translate(0,0) scale(1)", offset: 0},
        {transform: "translate(0,0) scale(1.1)", offset: 0.14},
        {transform: "translate(" + (fx / 2 + sign * nx) + "px," + (fy / 2 + sign * ny) + "px) scale(1.16)", offset: 0.55},
        {transform: "translate(" + fx + "px," + fy + "px) scale(1.06)", offset: 0.9},
        {transform: "translate(" + fx + "px," + fy + "px) scale(1)", offset: 1}
      ];
    }
    var opts = {duration: 1500, delay: 320, easing: "ease-in-out", fill: "forwards", id: "swap"};
    elA.animate(path(dx, dy, 1), opts);
    elB.animate(path(-dx, -dy, -1), opts);
    setTimeout(finish, opts.delay + opts.duration + 30);
    return true;
  }
  function stopClock(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    if(state) state.running = false;
  }

  /* The album: every dinosaur face up, nothing to match — just a look at the cards. */
  function openAlbum(){
    stopTurn();
    stopClock();
    clearFlipTimer();
    lock = false;
    state = {
      mode: "album", pairs: state ? state.pairs : 10, players: state ? state.players : 1,
      keepTurn: state ? state.keepTurn : true, holding: false,
      timed: state ? state.timed : false, clocks: null, timeout: null,
      deck: SPECIES.map(function(d){ return {id: d.id, matched: false}; }),
      found: [], scores: seatArray(0), turn: 0, won: false,
      sides: [{last: null, open: false}, {last: null, open: false}],
      seconds: 0, turns: 0, running: false
    };
    albumBtn.setAttribute("aria-pressed", "true");
    albumBtn.textContent = "Back to game";
    renderBoard(); renderScore(); renderFacts(); renderBanner();
    live.textContent = "Looking at all " + SPECIES.length + " animals. Tap one to read about it.";
  }

  function seatArray(value){
    return SEATS.map(function(){ return value; });
  }

  function newGame(opts){
    stopSpeech();
    stopName();
    stopTurn();
    opts = opts || {};
    var pairs = opts.pairs || (state ? state.pairs : 10);
    var players = opts.players || (state ? state.players : 1);
    /* two-player house rule: does a pair let you go again, or hand the turn over? */
    var keepTurn = opts.keepTurn !== undefined ? opts.keepTurn
                 : (state && state.keepTurn !== undefined ? state.keepTurn : true);
    var chosen = shuffle(SPECIES).slice(0, pairs);
    var deck = shuffle(chosen.concat(chosen).map(function(d){ return {id: d.id, matched: false}; }));

    var timed = opts.timed !== undefined ? opts.timed
              : (state && state.timed !== undefined ? state.timed : false);
    /* Extra hard is every animal there is, and it is always against the clock -
       even for one player, who otherwise only ever sees the time count up.
       It gets seven minutes, and the cards will not stay where they were put. */
    var extra = pairs >= SPECIES.length;
    var each = extra ? 420 : Math.max(90, pairs * 15);   /* 1:30 Easy, 2:30 Medium, 6:00 Hard, 7:00 Extra hard */
    var countdown = extra || (players >= 2 && timed);
    /* fetched now, so "Your time starts now!" is not late for the first card */
    if(extra && !goClip){ try{ goClip = new Audio("audio/turn/go.wav"); goClip.preload = "auto"; }catch(e){} }
    state = {pairs: pairs, players: players, keepTurn: keepTurn, deck: deck, found: [],
             scores: seatArray(0), turn: 0, won: false, timeout: null,
             timed: timed, clocks: countdown ? seatArray(each) : null, moving: extra, budget: each,
             sides: [{last: null, open: false}, {last: null, open: false}],
             holding: false, seconds: 0, turns: 0, running: false, mode: "play"};
    lock = false;
    popped = {};
    clearFlipTimer();
    stopClock();
    albumBtn.setAttribute("aria-pressed", "false");
    albumBtn.textContent = "All cards";
    renderBoard(); renderScore(); renderFacts(); renderBanner();
    live.textContent = pairs + " pairs of cards. " + (players >= 2 ? "Player 1 starts." : "Find them all!");
    /* Said out loud, so the table knows who begins - and as the naming ends the
       cards come up out of the trees in front of the animals, ready to play.
       With one player there is nobody to name, so they come up on their own. */
    var opening = state;
    function ready(){ if(state === opening && !state.won) stepForward(null); }
    if(players >= 2){
      setTimeout(function(){
        if(state !== opening || state.won) return;
        sayClip("start", "Player 1 starts!", ready);
      }, 550);
    } else {
      setTimeout(ready, 520);
    }
  }

  function onCardClick(event){
    var card = event.target.closest(".card");
    if(!card) return;

    if(state.mode === "album"){
      Array.prototype.forEach.call(board.querySelectorAll(".card"), function(el){
        delete el.dataset.picked;
      });
      card.dataset.picked = "true";
      jungleStart();
      sfx.flip();
      openCard(state.deck[Number(card.dataset.index)].id);
      return;
    }

    if(lock || state.won) return;
    var index = Number(card.dataset.index);
    var slot = state.deck[index];
    if(slot.matched || card.dataset.face === "up" || card.dataset.moving) return;

    /* Extra hard: the first card turned starts the clock, and the table is
       told so out loud before the card's own name is said */
    var starting = state.moving && !state.running && state.seconds === 0;
    startClock();
    jungleStart();
    card.dataset.face = "up";
    slot.seen = true;
    setLabel(card, slot);
    sfx.flip();
    if(starting){
      var game = state, waited = 0;
      /* after "Player 1 starts!" if that is still being said, never over it */
      function go(){
        if(state !== game || game.won) return;
        if(turnClip && waited < 4000){ waited += 150; setTimeout(go, 150); return; }
        sayClip("go", "Your time starts now!", function(){
          if(state === game && !game.won && card.dataset.face === "up") sayName(slot.id);
        });
      }
      setTimeout(go, 190);
    } else {
      setTimeout(function(){ sayName(slot.id); }, 190);
    }

    var open = Array.prototype.filter.call(
      board.querySelectorAll('.card[data-face="up"]'),
      function(el){ return el.dataset.state !== "matched"; }
    );
    if(open.length < 2) return;

    lock = true;
    state.turns++;
    var first = open[0], second = open[1];
    var a = state.deck[Number(first.dataset.index)];
    var b = state.deck[Number(second.dataset.index)];

    if(a.id === b.id){
      a.matched = b.matched = true;
      state.found.push(a.id);
      /* an older saved game has no rule of its own: it goes again, as it always did */
      var handing = state.players >= 2 && state.keepTurn === false;
      if(state.players >= 2){
        state.scores[state.turn]++;
        a.by = b.by = state.turn + 1;
      }
      [first, second].forEach(function(el){
        el.dataset.state = "matched"; el.disabled = true;
        if(a.by) el.dataset.owner = String(a.by);
        setLabel(el, a);
      });
      sfx.match();
      var nextUp = handing ? ((state.turn + 1) % state.players) : state.turn;
      live.textContent = "Match! " + byId(a.id).name + ". " +
        state.found.length + " of " + state.pairs + " found." +
        (state.players < 2 ? ""
         : handing ? " Player " + (nextUp + 1) + "'s turn."
         : " Player " + (state.turn + 1) + " goes again.");
      lock = handing;          /* held until the next player has been named */
      state.won = state.found.length === state.pairs;
      var game = state;
      if(state.won){
        stopClock();
        if(state.players === 1) recordBest();
        setTimeout(sfx.win, 280);
        setTimeout(sayWin, 1150);   // after the fanfare has rung out
        live.textContent = "You found them all!";
      } else if(handing){
        /* after the animal's own name has been said, not over the top of it */
        state.holding = true;
        setTimeout(function(){
          sayPair(function(){ if(state === game) handOver(); });
        }, 850);
      } else {
        setTimeout(function(){
          sayPair(function(){ if(state === game && game.players >= 2) sayAgain(); });
        }, 850);
      }
      renderScore(); openCard(a.id); renderBanner();
    } else {
      first.dataset.state = second.dataset.state = "wrong";
      if(state.players >= 2){
        live.textContent = "Not a pair. Player " +
          (((state.turn + 1) % state.players) + 1) + "'s turn.";
      } else {
        live.textContent = "Not a pair.";
      }
      renderScore();
      state.holding = true;
      flipHandle = setTimeout(function(){
        flipHandle = null;
        sfx.flip();
        [first, second].forEach(function(el){
          el.dataset.face = "down";
          delete el.dataset.state;
          setLabel(el, state.deck[Number(el.dataset.index)]);
        });
        /* the board stays shut until the next player has been named */
        if(state.players >= 2) handOver();
        else { state.holding = false; lock = false; }
      }, 2200);   // children need a good look before the cards turn back
    }
  }

  /* ---------- controls ---------- */
  board.addEventListener("click", onCardClick);

  /* the card under the mouse whispers; touch and pen stay silent */
  var hoverCard = null, hoverAt = 0;
  board.addEventListener("pointerover", function(event){
    if(event.pointerType && event.pointerType !== "mouse") return;
    var card = event.target.closest(".card");
    if(!card || card === hoverCard) return;
    hoverCard = card;
    if(card.disabled || card.dataset.face === "up") return;
    var now = Date.now();
    if(now - hoverAt < 70) return;   // a quick sweep across the board must not chatter
    hoverAt = now;
    sfx.hover();
  });
  board.addEventListener("pointerout", function(event){
    if(!event.relatedTarget || !board.contains(event.relatedTarget)) hoverCard = null;
  });
  document.getElementById("new-btn").addEventListener("click", openStart);

  albumBtn.addEventListener("click", function(){
    if(state.mode === "album") newGame();
    else openAlbum();
  });

  BOXES.forEach(function(box, i){
    box.close.addEventListener("click", function(){
      state.sides[i].open = false;
      renderFacts();
    });
  });

  /* On a phone the control row lives behind one button. Picking anything
     inside it closes the menu again, so the board comes straight back. */
  var menuBtn = document.getElementById("menu-btn"), bar = document.querySelector(".bar");
  function setMenu(open){
    document.body.dataset.menu = open ? "open" : "shut";
    menuBtn.setAttribute("aria-expanded", String(open));
    menuBtn.textContent = open ? "Close" : "Menu";
  }
  setMenu(false);
  menuBtn.addEventListener("click", function(e){
    e.stopPropagation();
    setMenu(document.body.dataset.menu !== "open");
  });
  bar.addEventListener("click", function(e){
    if(e.target === menuBtn) return;
    if(e.target.closest("button")) setMenu(false);
  });
  document.addEventListener("click", function(e){
    if(document.body.dataset.menu === "open" && !bar.contains(e.target)) setMenu(false);
  });

  /* the phone's sheet opens from the top bar and shuts from its own top edge,
     so the cards under it can always be reached */
  /* focus follows to the button that is left showing, never one gone from view */
  sheetHide.addEventListener("click", function(){
    state.sides[0].open = false;
    renderFacts();
    cardsTab.focus({preventScroll: true});
  });
  cardsTab.addEventListener("click", function(){
    if(!state.found.length) return;
    openCard(state.sides[0].last || state.found[state.found.length - 1]);
    sheetHide.focus({preventScroll: true});
  });

  var fullBtn = document.getElementById("full-btn");
  if(document.fullscreenEnabled || document.webkitFullscreenEnabled){
    fullBtn.hidden = false;
    fullBtn.addEventListener("click", function(){
      var root = document.documentElement;
      try{
        if(document.fullscreenElement || document.webkitFullscreenElement){
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        }
      }catch(e){}
    });
    document.addEventListener("fullscreenchange", function(){
      fullBtn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
      setTimeout(layoutBoard, 120);
    });
  }

  /* The way in: the one tap that both sets the game up and wakes the forest,
     since a browser will not start audio until the player has done something. */
  var startOverlay = document.getElementById("start");
  var startPairs = 10, startPlayers = 1, startKeep = 0;   /* hand the turn over */
  var startTimed = 0;                                    /* no time limit */
  var keepRow = document.getElementById("start-keep-row");
  var timerRow = document.getElementById("start-timer-row");

  function wirePick(id, attr, set){
    var group = document.getElementById(id);
    group.addEventListener("click", function(event){
      var btn = event.target.closest("button[role=radio]");
      if(!btn) return;
      Array.prototype.forEach.call(group.querySelectorAll("button"), function(el){
        el.setAttribute("aria-checked", String(el === btn));
      });
      set(Number(btn.dataset[attr]));
    });
  }
  /* extra hard is always against the clock, so there is nothing to choose */
  function showRows(){
    keepRow.hidden = startPlayers < 2;
    timerRow.hidden = startPlayers < 2 || startPairs >= SPECIES.length;
  }
  wirePick("start-size", "pairs", function(v){ startPairs = v; showRows(); });
  wirePick("start-players", "players", function(v){
    startPlayers = v;
    showRows();
  });
  wirePick("start-keep", "keep", function(v){ startKeep = v; });
  wirePick("start-timer", "clock", function(v){ startTimed = v; });

  /* Coming back to it keeps whatever was last played selected. */
  function openStart(){
    stopSpeech();
    stopClock();
    if(state){
      startPairs = state.pairs; startPlayers = state.players;
      startKeep = state.keepTurn === false ? 0 : 1;
      startTimed = state.timed === true ? 1 : 0;
    }
    Array.prototype.forEach.call(document.querySelectorAll("#start-size button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.pairs) === startPairs));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-players button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.players) === startPlayers));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-keep button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.keep) === startKeep));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-timer button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.clock) === startTimed));
    });
    showRows();
    startOverlay.hidden = false;
  }

  document.getElementById("start-btn").addEventListener("click", function(){
    startOverlay.hidden = true;
    jungleStart();
    newGame({pairs: startPairs, players: startPlayers,
             keepTurn: startKeep === 1, timed: startTimed === 1});
  });

  /* ---------- boot ---------- */
  function boot(data){
    if(data && data.state && data.state.deck){
      state = data.state;
      soundOn = data.soundOn !== false;
      soundBtn.setAttribute("aria-pressed", String(soundOn));
      soundBtn.setAttribute("aria-label", soundOn ? "Sounds on" : "Sounds off");
      startOverlay.hidden = true;
      renderBoard(); renderScore(); renderFacts(); renderBanner();
    } else {
      newGame({pairs: 10, players: 1});
    }
  }

  try{
    if(window.claude && window.claude.hot){
      if(window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {state: state, soundOn: soundOn}; });
      if(window.claude.hot.ready) window.claude.hot.ready(boot);
      else boot(window.claude.hot.data);
    } else { boot(null); }
  }catch(e){ boot(null); }
})();
</script>
