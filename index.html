    live.textContent = "Looking at all " + SPECIES.length + " animals. Tap one to read about it.";
  }

  function seatArray(value){
    return SEATS.map(function(){ return value; });
  }

  function newGame(opts){
    closeViewer();
    closeMap();
    stopSpeech();
    stopName();
    stopTurn();
    opts = opts || {};
    var pairs = opts.pairs || (state ? state.pairs : 10);
    var players = opts.players || (state ? state.players : 1);
    /* two-player house rule: does a pair let you go again, or hand the turn over? */
    var keepTurn = opts.keepTurn !== undefined ? opts.keepTurn
                 : (state && state.keepTurn !== undefined ? state.keepTurn : true);
    var chosen = shuffle(SPECIES).slice(0, pairs);
    var deck = shuffle(chosen.concat(chosen).map(function(d){ return {id: d.id, matched: false}; }));

    var timed = opts.timed !== undefined ? opts.timed
              : (state && state.timed !== undefined ? state.timed : false);
    /* Extra hard is thirty pairs, the most there are of any size, and it is always against the clock -
       even for one player, who otherwise only ever sees the time count up.
       Alone you get six minutes; at a table everybody sees everybody's
       cards and takes a share of the turns, so the table shares the time,
       with a minute more for each player after the first. The cards will
       not stay put. */
    var extra = pairs >= EXTRA_PAIRS;
    var table = 360 + 60 * (players - 1);   /* 6:00, 7:00, 8:00, 9:00 in all */
    var each = extra ? Math.round(table / players)   /* 6:00, 3:30, 2:40, 2:15 each */
                     : Math.max(90, pairs * 15);   /* 1:30 Easy, 2:30 Medium, 6:00 Hard */
    /* Hard alone is against the clock too: the same 6:00 a player gets at a table */
    /* a speedrun only ever counts up */
    var speedrun = (opts.speedrun !== undefined ? !!opts.speedrun : !!(state && state.speedrun)) &&
                   players === 1 && !extra;
    var countdown = extra || (players >= 2 && timed) || (players === 1 && pairs === 24 && !speedrun);
    state = {pairs: pairs, players: players, keepTurn: keepTurn, deck: deck, found: [],
             scores: seatArray(0), turn: 0, won: false, timeout: null,
             timed: timed, clocks: countdown ? seatArray(each) : null, moving: extra, budget: each,
             sides: [{last: null, open: false}, {last: null, open: false}],
             holding: false, seconds: 0, turns: 0, running: false, mode: "play", speedrun: speedrun};
    lock = false;
    popped = {};
    clearFlipTimer();
    stopClock();
    albumBtn.setAttribute("aria-pressed", "false");
    albumBtn.textContent = "All cards";
    barMapBtn.hidden = false;
    renderBoard(); renderScore(); renderFacts(); renderBanner();
    live.textContent = pairs + " pairs of cards. " + (players >= 2 ? "Player 1 starts." : "Find them all!");
    /* Said out loud, so the table knows who begins - and as the naming ends the
       cards come up out of the trees in front of the animals, ready to play.
       With one player there is nobody to name, so they come up on their own. */
    var opening = state;
    function ready(){ if(state === opening && !state.won) stepForward(null); }
    if(players >= 2){
      setTimeout(function(){
        if(state !== opening || state.won) return;
        /* a card already turned has started the game; do not talk over it */
        if(state.running){ ready(); return; }
        sayClip("start", "Player 1 starts!", ready);
      }, 550);
    } else {
      setTimeout(ready, 520);
    }
  }

  function onCardClick(event){
    var card = event.target.closest(".card");
    if(!card) return;

    if(state.mode === "album"){
      Array.prototype.forEach.call(board.querySelectorAll(".card"), function(el){
        delete el.dataset.picked;
      });
      card.dataset.picked = "true";
      jungleStart();
      sfx.flip();
      openCard(state.deck[Number(card.dataset.index)].id);
      return;
    }

    /* speedrun: no waiting on a miss - the next card turned sends the two
       back down as it comes up */
    if(state.speedrun && flipHandle && !state.won && card.dataset.face === "down" &&
       !state.deck[Number(card.dataset.index)].matched && !card.dataset.moving){
      clearTimeout(flipHandle);
      flipHandle = null;
      turnBack();
    }
    if(lock || state.won) return;
    var index = Number(card.dataset.index);
    var slot = state.deck[index];
    if(slot.matched || card.dataset.face === "up" || card.dataset.moving) return;

    startClock();
    jungleStart();
    card.dataset.face = "up";
    slot.seen = true;
    setLabel(card, slot);
    sfx.flip();
    setTimeout(function(){ sayName(slot.id); }, 190);

    var open = Array.prototype.filter.call(
      board.querySelectorAll('.card[data-face="up"]'),
      function(el){ return el.dataset.state !== "matched"; }
    );
    if(open.length < 2) return;

    lock = true;
    state.turns++;
    var first = open[0], second = open[1];
    var a = state.deck[Number(first.dataset.index)];
    var b = state.deck[Number(second.dataset.index)];

    if(a.id === b.id){
      a.matched = b.matched = true;
      state.found.push(a.id);
      /* an older saved game has no rule of its own: it goes again, as it always did */
      var handing = state.players >= 2 && state.keepTurn === false;
      if(state.players >= 2){
        state.scores[state.turn]++;
        a.by = b.by = state.turn + 1;
      }
      [first, second].forEach(function(el){
        el.dataset.state = "matched"; el.disabled = true;
        if(a.by) el.dataset.owner = String(a.by);
        setLabel(el, a);
      });
      sfx.match();
      var nextUp = handing ? ((state.turn + 1) % state.players) : state.turn;
      live.textContent = "Match! " + byId(a.id).name + ". " +
        state.found.length + " of " + state.pairs + " found." +
        (state.players < 2 ? ""
         : handing ? " Player " + (nextUp + 1) + "'s turn."
         : " Player " + (state.turn + 1) + " goes again.");
      lock = handing;          /* held until the next player has been named */
      state.won = state.found.length === state.pairs;
      var game = state;
      if(state.won){
        stopClock();
        if(state.players === 1) recordBest();
        setTimeout(sfx.win, 280);
        setTimeout(sayWin, 1150);   // after the fanfare has rung out
        live.textContent = "You found them all!";
      } else if(handing){
        /* after the animal's own name has been said, not over the top of it */
        state.holding = true;
        setTimeout(function(){
          sayPair(function(){ if(state === game) handOver(); });
        }, 850);
      } else {
        setTimeout(function(){
          sayPair(function(){ if(state === game && game.players >= 2) sayAgain(); });
        }, 850);
      }
      renderScore(); openCard(a.id); renderBanner();
    } else {
      first.dataset.state = second.dataset.state = "wrong";
      if(state.players >= 2){
        live.textContent = "Not a pair. Player " +
          (((state.turn + 1) % state.players) + 1) + "'s turn.";
      } else {
        live.textContent = "Not a pair.";
      }
      renderScore();
      state.holding = true;
      turnBack = function(){
        turnBack = null;
        sfx.flip();
        [first, second].forEach(function(el){
          el.dataset.face = "down";
          delete el.dataset.state;
          setLabel(el, state.deck[Number(el.dataset.index)]);
        });
        /* the board stays shut until the next player has been named */
        if(state.players >= 2) handOver();
        else { state.holding = false; lock = false; }
      };
      flipHandle = setTimeout(function(){
        flipHandle = null;
        turnBack();
      }, 2200);   // children need a good look before the cards turn back
    }
  }

  /* ---------- controls ---------- */
  board.addEventListener("click", onCardClick);

  /* the card under the mouse whispers; touch and pen stay silent */
  var hoverCard = null, hoverAt = 0;
  board.addEventListener("pointerover", function(event){
    if(event.pointerType && event.pointerType !== "mouse") return;
    var card = event.target.closest(".card");
    if(!card || card === hoverCard) return;
    hoverCard = card;
    if(card.disabled || card.dataset.face === "up") return;
    var now = Date.now();
    if(now - hoverAt < 70) return;   // a quick sweep across the board must not chatter
    hoverAt = now;
    sfx.hover();
  });
  board.addEventListener("pointerout", function(event){
    if(!event.relatedTarget || !board.contains(event.relatedTarget)) hoverCard = null;
  });
  document.getElementById("new-btn").addEventListener("click", openStart);

  albumBtn.addEventListener("click", function(){
    if(state.mode === "album" && albumFromStart) openStart();   /* shut again, it is still this album */
    else if(state.mode === "album") newGame();
    else openAlbum();
  });
  /* the map is there mid-game too: closing it comes back to the cards as they lay */
  barMapBtn.addEventListener("click", function(){ openMap(null, barMapBtn); });
  barMapBtn.innerHTML = GLOBE + "Map";

  BOXES.forEach(function(box, i){
    box.close.addEventListener("click", function(){
      state.sides[i].open = false;
      renderFacts();
    });
  });

  /* On a phone the control row lives behind one button. Picking anything
     inside it closes the menu again, so the board comes straight back. */
  var menuBtn = document.getElementById("menu-btn"), bar = document.querySelector(".bar");
  function setMenu(open){
    document.body.dataset.menu = open ? "open" : "shut";
    menuBtn.setAttribute("aria-expanded", String(open));
    menuBtn.textContent = open ? "Close" : "Menu";
  }
  setMenu(false);
  menuBtn.addEventListener("click", function(e){
    e.stopPropagation();
    setMenu(document.body.dataset.menu !== "open");
  });
  bar.addEventListener("click", function(e){
    if(e.target === menuBtn) return;
    if(e.target.closest("button")) setMenu(false);
  });
  document.addEventListener("click", function(e){
    if(document.body.dataset.menu === "open" && !bar.contains(e.target)) setMenu(false);
  });

  /* the phone's sheet opens from the top bar and shuts from its own top edge,
     so the cards under it can always be reached */
  /* focus follows to the button that is left showing, never one gone from view */
  sheetHide.addEventListener("click", function(){
    state.sides[0].open = false;
    renderFacts();
    cardsTab.focus({preventScroll: true});
  });
  cardsTab.addEventListener("click", function(){
    if(!state.found.length) return;
    openCard(state.sides[0].last || state.found[state.found.length - 1]);
    sheetHide.focus({preventScroll: true});
  });

  var fullBtn = document.getElementById("full-btn");
  if(document.fullscreenEnabled || document.webkitFullscreenEnabled){
    fullBtn.hidden = false;
    fullBtn.addEventListener("click", function(){
      var root = document.documentElement;
      try{
        if(document.fullscreenElement || document.webkitFullscreenElement){
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
        }
      }catch(e){}
    });
    document.addEventListener("fullscreenchange", function(){
      fullBtn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
      setTimeout(layoutBoard, 120);
    });
  }

  /* The way in: the one tap that both sets the game up and wakes the forest,
     since a browser will not start audio until the player has done something. */
  var startOverlay = document.getElementById("start");
  var startPairs = 10, startPlayers = 1, startKeep = 0;   /* hand the turn over */
  var startTimed = 0;                                    /* no time limit */
  var startSpeed = 0;                                    /* normal, not a speedrun */
  var speedRow = document.getElementById("start-speed-row");
  var keepRow = document.getElementById("start-keep-row");
  var timerRow = document.getElementById("start-timer-row");

  function wirePick(id, attr, set){
    var group = document.getElementById(id);
    group.addEventListener("click", function(event){
      var btn = event.target.closest("button[role=radio]");
      if(!btn) return;
      Array.prototype.forEach.call(group.querySelectorAll("button"), function(el){
        el.setAttribute("aria-checked", String(el === btn));
      });
      set(Number(btn.dataset[attr]));
    });
  }
  /* extra hard is always against the clock, so there is nothing to choose */
  /* a speedrun is one player racing the clock up, so extra hard, with its own clock, has none */
  function showRows(){
    speedRow.hidden = startPlayers > 1 || startPairs >= EXTRA_PAIRS;
    keepRow.hidden = startPlayers < 2;
    timerRow.hidden = startPlayers < 2 || startPairs >= EXTRA_PAIRS;
  }
  wirePick("start-size", "pairs", function(v){ startPairs = v; showRows(); });
  wirePick("start-players", "players", function(v){
    startPlayers = v;
    showRows();
  });
  wirePick("start-keep", "keep", function(v){ startKeep = v; });
  wirePick("start-timer", "clock", function(v){ startTimed = v; });
  wirePick("start-speed", "speed", function(v){ startSpeed = v; });

  /* Coming back to it keeps whatever was last played selected. */
  var startWasRunning = false;   /* a game paused by opening this, picked up again if it is shut */
  function openStart(){
    closeViewer();
    closeMap();
    stopSpeech();
    startWasRunning = !!(state && state.running);
    stopClock();
    /* an album's state holds defaults, not choices: leave the card as it was */
    if(state && state.mode !== "album"){
      startPairs = state.pairs; startPlayers = state.players;
      startKeep = state.keepTurn === false ? 0 : 1;
      startTimed = state.timed === true ? 1 : 0;
      startSpeed = state.speedrun ? 1 : 0;
    }
    Array.prototype.forEach.call(document.querySelectorAll("#start-size button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.pairs) === startPairs));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-players button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.players) === startPlayers));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-keep button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.keep) === startKeep));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-timer button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.clock) === startTimed));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#start-speed button"), function(el){
      el.setAttribute("aria-checked", String(Number(el.dataset.speed) === startSpeed));
    });
    showRows();
    startOverlay.hidden = false;
  }
  /* Shut without starting: the cards already dealt are still there to play,
     and the bar - all the cards, the map - is free to look through first. */
  function closeStart(){
    if(startOverlay.hidden) return;
    startOverlay.hidden = true;
    jungleStart();
    if(startWasRunning && state.mode !== "album" && !state.won) startClock();
    startWasRunning = false;
    document.getElementById("new-btn").focus({preventScroll: true});
  }
  document.getElementById("start-close").addEventListener("click", closeStart);
  /* only a press that began on the backdrop: a drag out of the card is not a close */
  var startPress = null;
  startOverlay.addEventListener("pointerdown", function(event){ startPress = event.target; });
  startOverlay.addEventListener("click", function(event){
    if(event.target === startOverlay && startPress === startOverlay) closeStart();
  });
  document.addEventListener("keydown", function(event){
    if(event.defaultPrevented || startOverlay.hidden || !mapEl.hidden || !viewer.hidden) return;
    if(event.key === "Escape"){ event.preventDefault(); closeStart(); }
  });

  /* Before a game: the album opens over the forest, and the map over the start
     card itself, so closing the map lands back here. */
  document.getElementById("start-album").addEventListener("click", function(){
    startOverlay.hidden = true;
    jungleStart();
    albumFromStart = true;
    openAlbum();
  });
  var startMapBtn = document.getElementById("start-map");
  startMapBtn.innerHTML = GLOBE + "Map";
  startMapBtn.addEventListener("click", function(){ openMap(null, startMapBtn); });

  document.getElementById("start-btn").addEventListener("click", function(){
    startOverlay.hidden = true;
    albumFromStart = false;
    startWasRunning = false;
    jungleStart();
    newGame({pairs: startPairs, players: startPlayers,
             keepTurn: startKeep === 1, timed: startTimed === 1,
             speedrun: startSpeed === 1 && startPlayers === 1 && startPairs < EXTRA_PAIRS});
  });

  /* ---------- boot ---------- */
  function boot(data){
    if(data && data.state && data.state.deck){
      state = data.state;
      soundOn = data.soundOn !== false;
      soundBtn.setAttribute("aria-pressed", String(soundOn));
      soundBtn.setAttribute("aria-label", soundOn ? "Sounds on" : "Sounds off");
      startOverlay.hidden = true;
      renderBoard(); renderScore(); renderFacts(); renderBanner();
    } else {
      newGame({pairs: 10, players: 1});
    }
  }

  try{
    if(window.claude && window.claude.hot){
      if(window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {state: state, soundOn: soundOn}; });
      if(window.claude.hot.ready) window.claude.hot.ready(boot);
      else boot(window.claude.hot.data);
    } else { boot(null); }
  }catch(e){ boot(null); }
})();
</script>
