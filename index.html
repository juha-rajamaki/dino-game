<meta charset="utf-8">
<title>Dinomemory</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* A single committed world: night jungle lit from above. */
  :root{
    --night:#070B08; --deep:#0C120D; --panel:rgba(12,20,14,.84); --panel-2:rgba(28,40,30,.9);
    --edge:rgba(140,168,140,.30); --edge-soft:rgba(130,158,130,.22);
    --bone:#F0E9D9; --bone-dim:#A2AE9E; --bone-faint:#6E7A6C;
    --amber:#F2AB3E; --amber-deep:#C07C1C; --amber-glow:rgba(242,171,62,.22);
    --fern:#46C98A; --rust:#CB5731;
    --p1:#4DA3FF; --p1-glow:rgba(77,163,255,.5);    /* player one, blue */
    --p2:#FF6152; --p2-glow:rgba(255,97,82,.5);     /* player two, red */
    --p3:#4FD98F; --p3-glow:rgba(79,217,143,.5);    /* player three, green */
    --p4:#FFDA47; --p4-glow:rgba(255,218,71,.5);    /* player four, yellow */
    --card-face:#F7F2E5; --card-ink:#1A2016;
    --back-1:#17402C; --back-2:#07160E;
    --jurassic:#4EC0D6; --cretaceous:#8BD05C;
    --plate-bg:radial-gradient(68% 60% at 50% 40%, #4A3520 0%, #241A0D 44%, #0C0B08 100%);
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; touch-action:manipulation;
    background:var(--night); color:var(--bone);
    font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5;
  }
  .jungle{position:fixed; inset:0; z-index:-2; pointer-events:none; overflow:hidden}
  /* the forest drifts, very slowly, the way a long lens breathes */
  .jungle::before{
    content:""; position:absolute; inset:-5%;
    background:url("img/jungle.webp") center/cover no-repeat;
    animation:drift 54s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes drift{
    from{transform:scale(1.05) translate3d(-1%,-0.6%,0)}
    to{transform:scale(1.13) translate3d(1.2%,0.7%,0)}
  }
  /* sunlight shifting through the canopy */
  .sunlight{
    position:absolute; inset:0;
    background:radial-gradient(46% 36% at 47% 32%, rgba(255,205,120,.16), transparent 70%);
    animation:sunshift 17s ease-in-out infinite alternate;
  }
  @keyframes sunshift{
    from{opacity:.55; transform:translate3d(-1.5%,0,0)}
    to{opacity:1; transform:translate3d(1.5%,1%,0)}
  }
  /* depth: dark at the edges, warm light falling through the canopy onto the board */
  .jungle::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(130% 100% at 50% 45%, transparent 38%, rgba(5,12,7,.26) 80%, rgba(3,8,5,.48) 100%),
      linear-gradient(180deg, rgba(4,9,6,.20) 0%, transparent 26%, rgba(3,8,5,.30) 100%);
  }

  .wrap{
    height:100%; width:100%; padding:0 clamp(10px,1vw,18px); padding-block:clamp(8px,1vw,13px);
    display:flex; flex-direction:column; gap:clamp(10px,1.1vw,16px);
  }

  /* ---------- top bar: only what a child needs ---------- */
  .bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; flex:none}
  .seg{
    display:flex; gap:4px; background:var(--panel); border:1px solid var(--edge-soft); border-radius:12px; padding:4px;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .seg button{
    appearance:none; border:0; background:transparent; color:var(--bone-dim);
    font-family:"Fredoka",system-ui,sans-serif; font-size:15px; font-weight:500;
    padding:8px 16px; border-radius:9px; cursor:pointer; white-space:nowrap;
  }
  .seg button:hover{color:var(--bone)}
  .seg button[aria-checked="true"]{background:var(--amber); color:#241603; font-weight:600}
  .btn{
    appearance:none; cursor:pointer; white-space:nowrap;
    font-family:"Fredoka",system-ui,sans-serif; font-size:15px; font-weight:600;
    background:var(--amber); color:#241603; border:1px solid var(--amber);
    padding:9px 16px; border-radius:11px;
  }
  .btn:hover{background:#FFBE57; border-color:#FFBE57}
  .btn.quiet{background:rgba(10,18,12,.7); color:var(--bone-dim); border-color:var(--edge);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  .btn.quiet:hover{background:var(--panel-2); color:var(--bone); border-color:var(--edge)}
  /* a toggle says on or off by its colour, not by a longer word */
  .btn.toggle[aria-pressed="true"]{color:var(--amber); border-color:rgba(242,171,62,.55)}
  .btn.toggle[aria-pressed="false"]{color:var(--bone-faint)}
  .spacer{flex:1 1 auto}
  :focus-visible{outline:3px solid var(--amber); outline-offset:3px}

  /* ---------- the one score that matters ---------- */
  .score{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .found-chip{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--edge-soft); border-radius:12px; padding:7px 14px;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .found-chip .n{font-family:"Fredoka",sans-serif; font-size:23px; font-weight:600; color:var(--amber); line-height:1}
  .found-chip .of{font-size:13px; color:var(--bone-dim); font-weight:700}
  .pips{display:flex; gap:4px}
  .pip{width:9px; height:9px; border-radius:50%; background:var(--edge); transition:background .25s, transform .25s}
  .pip.on{background:var(--amber); transform:scale(1.25)}

  .album-chip{
    display:flex; align-items:center; gap:9px; padding:8px 15px; border-radius:12px;
    background:var(--panel); border:1px solid var(--edge-soft); color:var(--bone-dim);
    font-size:13.5px; font-weight:700;
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .album-chip b{font-family:"Fredoka",sans-serif; font-size:19px; font-weight:600; color:var(--amber); line-height:1}
  .board[data-album="true"] .card{cursor:pointer}
  .board[data-album="true"] .card .side.up{box-shadow:inset 0 0 0 2px rgba(196,158,86,.85), inset 0 0 22px rgba(0,0,0,.55)}
  .board[data-album="true"] .card[data-picked="true"] .side.up{
    box-shadow:0 0 0 3px var(--amber), 0 0 26px rgba(242,171,62,.5);
  }

  .timer-chip{
    display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:12px;
    background:var(--panel); border:1px solid var(--edge-soft);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  }
  .timer-chip .t-ico{font-size:14px; opacity:.75}
  .timer-chip .t-val{
    font-family:"Fredoka",sans-serif; font-size:19px; font-weight:600; color:var(--bone);
    font-variant-numeric:tabular-nums; line-height:1; min-width:46px;
  }
  .timer-chip[data-running="true"] .t-ico{color:var(--amber); opacity:1}
  .timer-chip[data-low="true"] .t-val{color:var(--rust)}

  /* Whose turn it is has to be readable by a child who cannot read, so the two
     plates never look merely different - one of them is plainly awake and the
     other is plainly asleep. Four things move at once: the waiting plate dims,
     desaturates and shrinks back, while the playing one lights up in its own
     colour, steps forward, beats slowly and turns its dot into an arrow. */
  .turn-plate{
    display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:12px;
    background:var(--panel); border:1px solid var(--edge-soft);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    --pc:var(--amber); --pc-soft:rgba(242,171,62,.22); --pc-ink:#241603;
    opacity:.4; filter:saturate(.3); transform:scale(.92);
    transition:opacity .28s, filter .28s, transform .28s, background .28s, border-color .28s;
  }
  .turn-plate[data-player="1"]{--pc:var(--p1); --pc-soft:rgba(77,163,255,.3); --pc-ink:#04203C}
  .turn-plate[data-player="2"]{--pc:var(--p2); --pc-soft:rgba(255,97,82,.3); --pc-ink:#380A05}
  .turn-plate[data-player="3"]{--pc:var(--p3); --pc-soft:rgba(79,217,143,.3); --pc-ink:#03301B}
  .turn-plate[data-player="4"]{--pc:var(--p4); --pc-soft:rgba(255,218,71,.3); --pc-ink:#332700}
  /* three or four plates have to share the bar, so they give a little ground */
  .score[data-players="3"] .turn-plate,.score[data-players="4"] .turn-plate{padding:6px 11px; gap:7px}
  .score[data-players="3"] .turn-plate .who,.score[data-players="4"] .turn-plate .who{font-size:13.5px}
  .score[data-players="3"] .turn-plate .pairs,.score[data-players="4"] .turn-plate .pairs{font-size:18px}
  .score[data-players="3"] .turn-plate .clock,.score[data-players="4"] .turn-plate .clock{font-size:12.5px; padding-left:7px}
  .turn-plate .mark{font-size:11px; line-height:1; color:var(--pc)}
  .turn-plate .mark::before{content:"\25CF"}          /* waiting: a quiet dot */
  .turn-plate .who{font-family:"Fredoka",sans-serif; font-size:15px; font-weight:500; color:var(--pc)}
  .turn-plate .pairs{font-family:"Fredoka",sans-serif; font-size:21px; font-weight:600; color:var(--bone); line-height:1}

  .turn-plate[data-turn="true"]{
    opacity:1; filter:none; transform:scale(1.05);
    background:var(--pc); border-color:var(--pc);
    animation:turn-beat 2.1s ease-in-out infinite;
  }
  /* the game is over: nobody is waiting on anybody */
  body[data-won="true"] .turn-plate[data-turn="true"]{
    animation:none; box-shadow:0 0 0 4px var(--pc-soft);
  }
  .turn-plate[data-turn="true"] .who{font-weight:600}
  .turn-plate[data-turn="true"] .who,
  .turn-plate[data-turn="true"] .pairs,
  .turn-plate[data-turn="true"] .mark{color:var(--pc-ink)}
  .turn-plate[data-turn="true"] .mark{font-size:13px}
  .turn-plate[data-turn="true"] .mark::before{content:"\25B6"}   /* playing: pointing at you */
  /* each player's own clock, running only while the arrow points at them */
  .turn-plate .clock{
    font-family:"Fredoka",sans-serif; font-size:14px; font-weight:600; line-height:1;
    color:var(--bone-dim); font-variant-numeric:tabular-nums;
    margin-left:2px; padding-left:9px; border-left:1px solid var(--edge-soft);
  }
  .turn-plate[data-turn="true"] .clock{color:var(--pc-ink); border-left-color:rgba(0,0,0,.28)}
  .turn-plate[data-low="true"] .clock{color:var(--rust)}
  .turn-plate[data-turn="true"][data-low="true"] .clock{
    color:#2A0603; animation:clock-warn 1s steps(1) infinite;   /* the last half-minute */
  }
  @keyframes clock-warn{0%,55%{opacity:1} 56%,100%{opacity:.3}}
  @keyframes turn-beat{
    0%,100%{box-shadow:0 0 0 4px var(--pc-soft), 0 7px 22px -9px var(--pc)}
    55%{box-shadow:0 0 0 11px transparent, 0 7px 22px -9px var(--pc)}
  }

  /* ---------- board ---------- */
  .layout{
    flex:1 1 auto; min-height:0;
    display:grid; gap:clamp(10px,1vw,16px);
    /* the rail is sized off the pile cards, so four of them fit in a row */
    --rail-w:clamp(230px, calc(13.6vw + 62px), 296px);
    grid-template-columns:var(--rail-w) minmax(0,1fr) var(--rail-w);
  }
  .board-area{position:relative; min-width:0; min-height:0}
  .board{
    display:grid; gap:var(--gap,12px); height:100%; width:100%;
    position:relative; z-index:1;   /* in the scene, behind the animals, until play begins */
    grid-template-columns:repeat(var(--cols,4), var(--card-w,120px));
    justify-content:center; align-content:center;
  }
  .card{
    appearance:none; border:0; padding:0; background:transparent; cursor:pointer;
    width:var(--card-w,120px); height:var(--card-h,90px); perspective:1200px; display:block;
    position:relative; z-index:1;
    transition:z-index 0s linear .5s;   /* on the way down, wait for the flip to finish */
  }
  /* a turned card comes up in front of its neighbours */
  .card[data-face="up"]{z-index:5; transition-delay:0s}

  /* The animals stand over the board while it waits, which is half the picture.
     The first card turned calls the board forward: the cards fade up out of the
     trees in a ripple spreading from the one that was touched, and from then on
     nothing stands between a child and the cards. */
  .board[data-forward="true"]{z-index:3}   /* over the animals, still under the rails */
  .board[data-forward="true"] .card{
    animation:step-up .46s cubic-bezier(.22,.9,.3,1) backwards;
    animation-delay:var(--in,0ms);
  }
  @keyframes step-up{
    from{opacity:.3; transform:translateY(9px) scale(.955)}
    to{opacity:1; transform:none}
  }
  .card:disabled{cursor:default}
  /* Extra hard: two cards trading places ride over the rest, glowing, so
     everyone at the table can follow where each one went */
  .card[data-moving="true"]{z-index:8; transition-delay:0s; pointer-events:none}
  .card[data-moving="true"] .side.down{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(242,171,62,.75), 0 0 28px rgba(242,171,62,.55), 0 24px 40px -12px #000;
  }
  .inner{
    position:relative; width:100%; height:100%; transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.3,.85,.35,1);
  }
  .card[data-face="up"] .inner{transform:rotateY(180deg)}
  .side{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; overflow:hidden;
    box-shadow:0 2px 3px rgba(0,0,0,.5), 0 14px 30px -14px rgba(0,0,0,.9);
  }

  .side.down{
    background:linear-gradient(160deg, rgba(16,46,31,.62), rgba(4,13,8,.74));
    -webkit-backdrop-filter:blur(2px) saturate(1.25);
    backdrop-filter:blur(2px) saturate(1.25);
    border:1px solid rgba(190,225,190,.30); display:grid; place-items:center;
  }
  .side.down::after{
    content:""; position:absolute; inset:7px; border:1.5px solid rgba(242,171,62,.28); border-radius:8px;
  }
  .track{width:52%; height:52%; opacity:.85; transition:opacity .25s, transform .25s;
         filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
  .track path,.track ellipse{fill:var(--amber)}
  .card:hover:not(:disabled) .side.down{border-color:var(--amber); box-shadow:0 0 0 2px rgba(242,171,62,.4), 0 16px 32px -14px #000}
  .card:hover:not(:disabled) .track{opacity:1; transform:scale(1.06)}

  /* a collector's plate: the animal in its landscape, inside a bronze frame */
  .side.up{
    transform:rotateY(180deg);
    background:#0A140D;
    border:1px solid #6E5626;
    box-shadow:inset 0 0 0 2px rgba(196,158,86,.85), inset 0 0 22px rgba(0,0,0,.55);
    display:flex; flex-direction:column; justify-content:flex-end; padding:0;
  }
  .scene{position:absolute; inset:0; z-index:0; background:var(--plate-bg)}
  .scene::after{               /* a pool of warm light, then dark to the edges */
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(46% 40% at 50% 38%, rgba(242,190,110,.16), transparent 70%),
      radial-gradient(120% 92% at 50% 44%, transparent 40%, rgba(4,4,3,.62) 100%);
  }
  /* the plate art is built 4:3, backdrop baked in, so it fills the card exactly */
  .art{position:absolute; inset:0; z-index:2}   /* the animal covers the star */
  .art img{width:100%; height:100%; object-fit:contain; display:block}
  .art::after{                 /* shade under the name banner */
    content:""; position:absolute; left:0; right:0; bottom:0; height:34%;
    background:linear-gradient(180deg, transparent, rgba(4,4,3,.55));
  }
  .plate{
    position:relative; z-index:3; text-align:center; margin:0 5% 4.5%; padding:3px 9px 4px;
    background:linear-gradient(180deg, #1B1B13, #070805);
    box-shadow:inset 0 0 0 1px rgba(196,158,86,.5);
    clip-path:polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
  }
  .plate .name{
    display:block; font-family:"Fredoka",sans-serif; font-weight:500; color:#F4EEE0;
    font-size:clamp(7px, calc(var(--card-h,90px) * .098), 18px); line-height:1.2;
    text-transform:uppercase; letter-spacing:.07em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(0,0,0,.85);
  }
  .plate .name.long{           /* Pachycephalosaurus needs the room */
    font-size:clamp(6px, calc(var(--card-h,90px) * .078), 15px); letter-spacing:.035em;
  }

  .card[data-state="matched"] .side.up{box-shadow:0 0 0 3px var(--own,var(--amber)), 0 0 26px var(--own-glow,rgba(242,171,62,.5))}
  .card[data-state="matched"] .side.up::after{
    content:"\2605"; position:absolute; top:4%; right:5%; z-index:1;   /* behind the animal */
    color:var(--amber); line-height:1;
    font-size:clamp(13px, calc(var(--card-h,90px) * .2), 36px);
    text-shadow:0 0 14px rgba(242,171,62,.55), 0 2px 5px rgba(0,0,0,.65);
  }

  /* In a two-player game a pair keeps the colour of whoever found it - player
     one blue, player two red - so the board itself says how the game stands.
     The frame turns; the star stays gold and the animal's name keeps its bronze
     plate, so the card still reads as a collector's card first. */
  .card[data-owner="1"]{--own:var(--p1); --own-glow:var(--p1-glow)}
  .card[data-owner="2"]{--own:var(--p2); --own-glow:var(--p2-glow)}
  .card[data-owner="3"]{--own:var(--p3); --own-glow:var(--p3-glow)}
  .card[data-owner="4"]{--own:var(--p4); --own-glow:var(--p4-glow)}
  .card[data-owner] .side.up{border-color:var(--own)}
  .card[data-state="matched"] .inner{animation:pop .45s ease}
  .card[data-state="wrong"] .side.up{box-shadow:0 0 0 3px var(--rust)}
  .card[data-state="wrong"] .inner{animation:shake .4s ease}
  @keyframes pop{0%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.09)}100%{transform:rotateY(180deg) scale(1)}}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}

  /* ---------- rail ---------- */
  .rail{
    display:flex; flex-direction:column; gap:12px; min-height:0; overflow-y:auto;
    position:relative; z-index:4;        /* above the animals, below a turned card */
  }
  .rail[hidden]{display:none}
  /* Two players to a side share the height between them rather than queueing
     one below the other, so nobody has to scroll the rail to find their card.
     Each box keeps its own scrollbar for the long ones. */
  /* Two share a box, so it wears the colour of whoever's card is in it. */
  .facts[data-owner="1"]{--box-c:var(--p1)}
  .facts[data-owner="2"]{--box-c:var(--p2)}
  .facts[data-owner="3"]{--box-c:var(--p3)}
  .facts[data-owner="4"]{--box-c:var(--p4)}
  .facts[data-owner]{border-color:var(--box-c); box-shadow:inset 0 2.5px 0 0 var(--box-c)}
  .facts[data-owner] h2{color:var(--box-c)}

  .rail[data-seats="2"]{overflow:hidden}
  .rail[data-seats="2"] .facts{flex:1 1 0; min-height:96px; overflow-y:auto}
  /* The rail itself never scrolls on a big screen: a full pile of thirty
     keeps its place, and the card under it gives way and reads on inside. */
  @media (min-width:981px) and (orientation:landscape){
    .rail{overflow:hidden}
    .rail .facts{flex-shrink:1; min-height:96px; overflow-y:auto; scrollbar-width:thin}
  }
  .panel{
    background:var(--panel); border:1px solid var(--edge-soft); border-radius:14px;
    -webkit-backdrop-filter:blur(12px) saturate(1.1); backdrop-filter:blur(12px) saturate(1.1);
  }


  .facts{padding:16px 17px 17px}
  .facts h2{
    font-family:"Fredoka",sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.13em;
    text-transform:uppercase; color:var(--bone-faint); margin:0 0 13px;
  }
  .portrait{ /* 16:9 keeps the panel short enough for the longest text */
    display:block; width:100%; aspect-ratio:16/9; object-fit:contain; border-radius:12px;
    background:var(--plate-bg);
    border:2px solid rgba(196,158,86,.85); margin:0 0 14px;
    box-shadow:0 14px 26px -12px rgba(0,0,0,.9);
  }
  .facts .name{
    font-family:"Fredoka",sans-serif; font-size:24px; font-weight:600; color:var(--amber);
    margin:0; line-height:1.1; overflow-wrap:anywhere;   /* Rhamphorhynchus needs it */
  }
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
  .tag{
    display:flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    background:var(--panel-2); border-radius:999px; padding:4px 11px; color:var(--bone-dim);
  }
  .tag .dot{width:8px; height:8px; border-radius:50%; background:var(--bone-faint)}
  .tag .dot.Jurassic{background:var(--jurassic)} .tag .dot.Cretaceous{background:var(--cretaceous)}
  .facts .means{
    margin:4px 0 0; font-size:14.5px; color:var(--bone-dim); font-style:italic;
  }
  .facts .fact{margin:0; font-size:15px; color:var(--bone); line-height:1.58}
  .facts-body{animation:reveal .35s ease}
  @keyframes reveal{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
  .stats{display:grid; gap:10px; margin:13px 0 13px}
  .stat-row{display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:11px}
  .stat-row .lab{font-size:10.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--bone-faint)}
  .meter{height:9px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden}
  .meter span{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, var(--amber-deep), var(--amber))}
  .stat-row .val{
    font-family:"Fredoka",sans-serif; font-size:15px; font-weight:600; color:var(--bone);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .diet{
    display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px;
    font-size:13px; font-weight:800; letter-spacing:.02em; white-space:nowrap;
  }
  .diet[data-food="Meat"]{background:rgba(203,87,49,.22); color:#F2A184; border:1px solid rgba(203,87,49,.5)}
  .diet[data-food="Plants"]{background:rgba(70,201,138,.15); color:#84E2B4; border:1px solid rgba(70,201,138,.42)}
  .diet[data-food="Fish"]{background:rgba(78,192,214,.15); color:#8CDBEB; border:1px solid rgba(78,192,214,.42)}
  .diet[data-food="Insects"]{background:rgba(176,132,226,.15); color:#C8A6EC; border:1px solid rgba(176,132,226,.42)}
  .diet[data-food="Anything"]{background:rgba(242,171,62,.15); color:var(--amber); border:1px solid rgba(242,171,62,.42)}
  .not-dino{
    display:inline-block; margin:9px 0 0; padding:5px 12px; border-radius:999px;
    background:rgba(78,192,214,.14); border:1px solid rgba(78,192,214,.45); color:#8CDBEB;
    font-size:12.5px; font-weight:800;
  }

  .rows{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:12px 0 14px; font-size:13.5px}
  .rows dt{color:var(--bone-faint); font-size:10.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; padding-top:3px}
  .rows dd{margin:0; color:var(--bone); font-weight:700}
  .rows .per{display:flex; align-items:center; gap:6px}
  .facts .hello{margin:0; font-size:15px; color:var(--bone-dim); line-height:1.6}
  .facts .hello b{color:var(--bone); font-weight:800}
  .facts{position:relative}
  /* the play button rides beside the name */
  .name-row{display:flex; align-items:center; gap:10px; margin:0}
  .name-row .name{flex:0 1 auto}
  .name-row .play-x{margin-left:auto}   /* sits against the right edge */
  .play-x{
    flex:none; width:32px; height:32px; border-radius:50%;
    background:var(--amber); border:1px solid var(--amber); color:#241603;
    font-size:13px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0;
    font-family:"Nunito",sans-serif;
  }
  .play-x:hover{background:#FFBE57; border-color:#FFBE57}
  .play-x[data-playing="true"]{background:transparent; color:var(--amber)}
  .close-x{
    position:absolute; top:13px; right:13px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.07); border:1px solid var(--edge-soft); color:var(--bone-dim);
    font-size:19px; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0;
    font-family:"Nunito",sans-serif;
  }
  .close-x:hover{background:var(--amber); color:#241603; border-color:var(--amber)}

  /* the pile every found card goes into */
  .pile{padding:15px 16px 17px; flex:none}
  /* the name to the left, how many they have won away to the right */
  .pile h2{
    font-family:"Fredoka",sans-serif; font-size:11.5px; font-weight:600; letter-spacing:.13em;
    text-transform:uppercase; color:var(--bone-faint); margin:0 0 12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .pile{--pile-c:var(--amber); --pile-edge:rgba(196,158,86,.55); --pile-soft:rgba(242,171,62,.45)}
  .pile[data-owner="1"]{--pile-c:var(--p1); --pile-edge:rgba(77,163,255,.6); --pile-soft:var(--p1-glow)}
  .pile[data-owner="2"]{--pile-c:var(--p2); --pile-edge:rgba(255,97,82,.6); --pile-soft:var(--p2-glow)}
  .pile[data-owner="3"]{--pile-c:var(--p3); --pile-edge:rgba(79,217,143,.6); --pile-soft:var(--p3-glow)}
  .pile[data-owner="4"]{--pile-c:var(--p4); --pile-edge:rgba(255,218,71,.6); --pile-soft:var(--p4-glow)}
  .pile[data-owner] h2{color:var(--pile-c)}
  /* how many are in the pile: a plain numeral in the player's own colour,
     away to the right, the size the single-player count has always been */
  .pile-n{
    flex:none; font-family:"Fredoka",sans-serif; font-size:23px; font-weight:600;
    line-height:1; letter-spacing:0; color:var(--pile-c);
    font-variant-numeric:tabular-nums; text-shadow:0 0 16px var(--pile-soft);
  }
  /* four to a row, always: the circles take their size from the rail */
  .pile-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px}
  .pile-card{
    appearance:none; padding:0; display:block; cursor:pointer; background:var(--plate-bg);
    width:100%; aspect-ratio:1; border-radius:50%; overflow:hidden;
    border:2px solid var(--pile-edge); transition:.18s;
    box-shadow:0 5px 12px -6px #000;
  }
  .pile-card.fresh{animation:badge-in .34s cubic-bezier(.2,1.2,.4,1) backwards}
  /* the art is a wide plate: fill the circle from it and keep the animal centred */
  .pile-card img{width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.06)}
  .pile-card:hover{border-color:var(--pile-c); transform:translateY(-2px) scale(1.06)}
  .pile-card[data-open="true"]{border-color:var(--pile-c); box-shadow:0 0 0 3px var(--pile-soft), 0 5px 12px -6px #000}
  @keyframes badge-in{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
  /* the two of them stand in the scene, one at each side of the board */
  /* both animals stand at the foot of the page, over the cards until play begins */
  .beast{position:fixed; bottom:0; z-index:2; pointer-events:none}
  .beast img{
    display:block; width:auto; max-width:none;
    filter:brightness(.94) saturate(1.02) contrast(1.02) drop-shadow(0 16px 26px rgba(0,0,0,.6));
  }
  .beast-left{left:0}
  .beast-left img{
    height:min(58vh, 580px); margin:0 0 -2.5% -8vw;   /* further off the left edge */
    transform-origin:0 100%;
    animation:loom 36s ease-in-out infinite alternate;
  }
  .beast-right{right:0; display:flex; align-items:flex-end}
  .beast-right .velo1{
    height:min(23vh, 228px); margin:0 -3.5vw -1.5% 0;   /* slides right, closer to the rock */
    transform-origin:100% 100%;
    animation:stalk 27s ease-in-out infinite alternate;
  }
  .beast-right .velo2{
    height:min(34vh, 340px); margin:0 -1% -2% -2%;
    transform-origin:100% 100%;
    animation:perch 31s ease-in-out infinite alternate;
  }
  @keyframes perch{
    from{transform:scale(1) translate3d(1.5%,0,0)}
    to{transform:scale(1.05) translate3d(-1%,0,0)}
  }
  @keyframes loom{
    from{transform:scale(1) translate3d(-1%,0,0)}
    to{transform:scale(1.06) translate3d(1.5%,0,0)}
  }
  @keyframes stalk{
    from{transform:scale(1.04) translate3d(2%,0,0)}
    to{transform:scale(1) translate3d(-1.5%,0,0)}
  }

  /* The game is over and the board is no longer anybody's: the animals come
     in over the cards. The Tyrannosaurus runs in from off the left edge, the
     velociraptors from off the right, each arriving at its own moment and
     stopping where it stands. */
  body[data-won="true"] .beast-left img{
    animation:trex-runs-in 1.15s cubic-bezier(.2,.86,.3,1) both;
  }
  body[data-won="true"] .beast-right .velo1{
    animation:velo-runs-in 1.05s cubic-bezier(.2,.86,.3,1) .22s both;
  }
  body[data-won="true"] .beast-right .velo2{
    animation:velo-runs-in 1.1s cubic-bezier(.2,.86,.3,1) .06s both;
  }
  @keyframes trex-runs-in{
    from{transform:translate3d(-125%,0,0) scale(1.24)}
    to{transform:translate3d(8%,0,0) scale(1.24)}
  }
  @keyframes velo-runs-in{
    from{transform:translate3d(135%,0,0) scale(1.26)}
    to{transform:translate3d(-13%,0,0) scale(1.26)}
  }

  /* ---------- win ---------- */
  .banner{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6; text-align:center;
    width:min(420px,92%); background:rgba(18,27,20,.94); border:2px solid var(--amber); border-radius:18px;
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    padding:26px 26px 24px; box-shadow:0 0 60px rgba(242,171,62,.28), 0 30px 70px -20px #000;
  }
  .banner h2{font-family:"Fredoka",sans-serif; font-size:30px; font-weight:600; margin:0; color:var(--amber)}
  .banner .close-x{top:11px; right:11px}
  .banner[data-win="1"]{border-color:var(--p1)} .banner[data-win="1"] h2{color:var(--p1)}
  .banner[data-win="2"]{border-color:var(--p2)} .banner[data-win="2"] h2{color:var(--p2)}
  .banner[data-win="3"]{border-color:var(--p3)} .banner[data-win="3"] h2{color:var(--p3)}
  .banner[data-win="4"]{border-color:var(--p4)} .banner[data-win="4"] h2{color:var(--p4)}
  .banner p{margin:8px 0 18px; color:var(--bone-dim); font-size:15px}
  .stars{display:flex; justify-content:center; gap:8px; margin:14px 0 4px; font-size:34px; line-height:1}
  .stars .s{color:rgba(240,233,217,.18)}
  .stars .s.on{color:var(--amber); text-shadow:0 0 18px rgba(242,171,62,.55); animation:starPop .45s ease backwards}
  .stars .s.on:nth-child(2){animation-delay:.16s}
  .stars .s.on:nth-child(3){animation-delay:.32s}
  @keyframes starPop{0%{transform:scale(.2); opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1); opacity:1}}
  /* star glow burst — expands outward from each star after it pops in */
  .stars .s.on{position:relative}
  .stars .s.on::after{
    content:"\2605"; position:absolute; inset:0; pointer-events:none;
    color:transparent; animation:starBurst .55s ease-out backwards;
    animation-delay:inherit;
  }
  @keyframes starBurst{
    0%  {transform:scale(1);   text-shadow:0 0 0 rgba(242,171,62,.7)}
    40% {transform:scale(2.2); text-shadow:0 0 18px rgba(242,171,62,.5)}
    100%{transform:scale(3.5); text-shadow:0 0 0 rgba(242,171,62,0); opacity:0}
  }
  /* win banner slides in */
  @keyframes bannerIn{
    from{opacity:0; transform:translate(-50%,calc(-50% - 28px)) scale(.94)}
    60% {transform:translate(-50%,calc(-50% + 5px)) scale(1.015)}
    to  {opacity:1; transform:translate(-50%,-50%)}
  }
  .banner{animation:bannerIn .52s cubic-bezier(.22,.86,.3,1) both}
  .final-score{
    font-family:"Fredoka",sans-serif; font-size:42px; font-weight:600; color:var(--bone);
    line-height:1; margin:12px 0 0; font-variant-numeric:tabular-nums;
  }
  .final-score small{
    display:block; font-family:"Nunito",sans-serif; font-size:10.5px; font-weight:800;
    letter-spacing:.16em; text-transform:uppercase; color:var(--bone-faint); margin-top:7px;
  }
  .best-line{margin:12px 0 0; font-size:12.5px; color:var(--amber); font-weight:700}

  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* ---------- the way in ---------- */
  .start{
    position:fixed; inset:0; z-index:40; display:grid; place-items:center;
    padding:20px; background:rgba(4,9,6,.5);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .start[hidden]{display:none}
  .start-card{
    width:min(430px,100%); text-align:center;
    background:rgba(10,18,12,.92); border:1px solid var(--edge); border-radius:20px;
    padding:26px 22px 22px; box-shadow:0 30px 70px -24px #000;
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  }
  .start h1{
    font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(30px,8vw,40px);
    color:var(--amber); margin:0 0 6px; line-height:1.05;
  }
  .start .lead{margin:0 0 20px; color:var(--bone-dim); font-size:14.5px; line-height:1.5}
  .start .row{margin:0 0 15px}
  .start .row-label{
    font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--bone-faint); margin:0 0 7px;
  }
  .start .seg{width:100%}
  .start .seg button{flex:1; display:flex; flex-direction:column; gap:1px; padding:9px 6px}
  /* Extra hard says what it is in its colour, not in small print */
  .start .seg button.extra{color:var(--p2); font-weight:700}
  .start .seg button.extra[aria-checked="true"]{background:var(--p2); color:#fff}
  /* pointed at, it turns white like the others, and asks once more */
  .start .seg button.extra:hover,.start .seg button.extra:focus-visible{color:var(--bone)}
  .start .seg button.extra[aria-checked="true"]:hover,
  .start .seg button.extra[aria-checked="true"]:focus-visible{color:#fff}
  .start .seg button.extra .sure{visibility:hidden}
  /* and keeps asking once it is picked, which is all a finger ever sees */
  .start .seg button.extra:hover .sure,.start .seg button.extra:focus-visible .sure,
  .start .seg button.extra[aria-checked="true"] .sure{visibility:visible}
  .start .seg button small{font-size:10.5px; opacity:.75; font-family:"Nunito",sans-serif; font-weight:700}
  .start .go{width:100%; margin-top:10px; font-size:19px; padding:14px}

  /* ---------- phones and small tablets ---------- */
  .menu-btn{display:none}
  /* up top beside the menu, so it never lies over the cards it opens and shuts */
  .bar > .cards-tab{display:none}
  .sheet-hide{display:none}

  @media (max-width:980px), (orientation:portrait){
    html,body{height:100%}
    body{overflow:hidden}
    .wrap{height:100%}
    .layout{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr)}
    .board-area{min-height:0}
    /* one screen, one sheet: player two's pile moves in beside player one's */
    .rail-2{display:none}

    /* the whole control row folds behind one button */
    .menu-btn{display:block}
    .bar > .seg, .bar > .btn:not(.menu-btn):not(.cards-tab){display:none}
    body[data-menu="open"] .bar{
      position:fixed; z-index:30; left:8px; right:8px;
      top:calc(8px + env(safe-area-inset-top, 0px));
      flex-direction:column; align-items:stretch; gap:8px;
      background:rgba(10,18,12,.96); border:1px solid var(--edge); border-radius:16px;
      padding:10px;
      -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    }
    body[data-menu="open"] .bar > .seg,
    body[data-menu="open"] .bar > .btn:not(.menu-btn):not(.cards-tab){display:flex; justify-content:center}
    body[data-menu="open"] .bar > .cards-tab{display:none}
    body[data-menu="open"] .spacer{display:none}

    /* the card slides up over the board instead of sitting under it */
    .rail{
      position:fixed; left:0; right:0; bottom:0; z-index:25;
      max-height:78vh; overflow-y:auto; gap:10px;
      padding:12px 12px calc(14px + env(safe-area-inset-bottom, 0px));
      background:rgba(8,14,10,.97); border-top:1px solid var(--edge-soft);
      border-radius:18px 18px 0 0; box-shadow:0 -14px 40px -16px #000;
      -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
      transform:translateY(103%); transition:transform .28s ease;
    }
    body[data-card="open"] .rail{transform:none}
    .rail .panel{background:transparent; border:0; -webkit-backdrop-filter:none; backdrop-filter:none}
    .facts{padding:6px 2px 6px}
    .pile{padding:2px 2px 10px; border-bottom:1px solid var(--edge-soft)}
    /* the sheet is the width of the screen: as many to a row as fit */
    .pile-grid{display:flex; flex-wrap:wrap}
    .pile-card{width:clamp(42px, 3.4vw, 58px)}
    .portrait{aspect-ratio:2/1}
    /* a tablet's sheet is wide: keep the card to a column that can be read */
    .rail > .panel{width:100%; max-width:900px; margin-inline:auto}

    /* its own row under the bar, and the twin of the sheet's Hide button */
    .bar > .cards-tab{
      display:block; order:1; flex:1 0 100%; min-height:60px; padding:0;
      border-radius:16px; font-size:24px; box-shadow:0 8px 20px -10px #000;
    }
    .bar > .cards-tab[hidden]{display:none}
    /* once the sheet is up, it is put away from its own top edge instead;
       the row keeps its room so the board does not jump */
    body[data-card="open"] .bar > .cards-tab{visibility:hidden}
    /* big, for a small finger: the whole width of the sheet */
    .sheet-hide{
      display:block; position:sticky; top:-12px; z-index:2;
      width:100%; max-width:900px; margin:-12px auto 0; padding:12px 0 10px;
      appearance:none; border:0; cursor:pointer;
      background:rgba(8,14,10,.97);
    }
    .sheet-hide span{
      display:block; min-height:60px; line-height:58px; border-radius:16px;
      background:var(--amber); color:#241603; border:1px solid var(--amber);
      font-family:"Fredoka",sans-serif; font-size:24px; font-weight:600;
      box-shadow:0 8px 20px -10px #000;
    }

    /* the animals give the cards their room back */
    .beast-right{display:none}
    .beast-left img{height:min(26vh,210px); margin:0 0 -2% -14vw}
  }

  /* Wide enough for two columns, and still on one side of the table: the
     animal stands beside its own description rather than towering over it,
     which keeps the sheet short enough to leave the board in view. */
  @media (min-width:660px) and (orientation:portrait),
         (min-width:660px) and (max-width:980px){
    .facts-body{display:flex; align-items:flex-start; gap:clamp(16px,2.5vw,28px)}
    .facts-body > .portrait{
      flex:none; width:clamp(200px, 33%, 320px); aspect-ratio:4/3; margin:0;
    }
    .facts-text{flex:1 1 0; min-width:0; padding-top:9px}   /* clear of the close button */
    .facts-text .name{font-size:27px}
    .stats{margin:14px 0}
    .diet{justify-self:start}        /* a label, not a bar, once there is room */
    .rows{grid-template-columns:auto minmax(0,1fr)}
    .facts h2{margin-bottom:10px}
  }

  @media (max-width:560px){
    .beast-left{display:none}
  }

  /* a finger has no hover, and a stuck hover state looks broken */
  @media (hover:none){
    .card:hover:not(:disabled) .side.down{border-color:rgba(190,225,190,.30); box-shadow:none}
    .card:hover:not(:disabled) .track{opacity:.85; transform:none}
  }
  @media (prefers-reduced-motion: reduce){
    .inner,.pip{transition:none}
    .card[data-state="matched"] .inner,.card[data-state="wrong"] .inner{animation:none}
    .jungle::before,.sunlight,.beast img{animation:none}
    body[data-won="true"] .beast img{animation:none}
    .board[data-forward="true"] .card{animation:none}
    .pile-card.fresh{animation:none}
    .turn-plate[data-turn="true"]{animation:none; box-shadow:0 0 0 4px var(--pc-soft)}
    .turn-plate[data-turn="true"][data-low="true"] .clock{animation:none}
    .stars .s.on::after,.banner{animation:none}
  }
</style>

<div class="jungle" id="jungle" aria-hidden="true"><div class="sunlight"></div></div>

</div>

<div class="start" id="start">

        <button type="button" role="radio" data-pairs="10" aria-checked="true">Medium<small>10</small></button>
        <button type="button" role="radio" data-pairs="24" aria-checked="false">Hard<small>24</small></button>

<div class="wrap">

  function node(tag, cls){

  /* Up to four seats at the table, each with a pile of the cards it has won.

  var SEATS = (function(){

  /* One box to a side, under the piles, shared by the players who sit there:

  var BOXES = (function(){

  function timeText(sec){

  /* Score: a point for every pair, a bonus for guessing well, a bonus for being quick. */
  function scoreOf(st){
    var accuracy = st.turns ? st.found.length / st.turns : 0;
    return {
      accuracy: accuracy,
      match: st.found.length * 100,
      sharp: Math.round(accuracy * 500),
      quick: Math.max(0, 400 - st.seconds * 2),
      get total(){ return this.match + this.sharp + this.quick; }
    };
  }
  function starsOf(st){
    var turnRatio = st.turns / Math.max(1, st.found.length);
    var perPair = st.seconds / Math.max(1, st.found.length);
    if(turnRatio <= 1.6 && perPair <= 9) return 3;
    if(turnRatio <= 2.4 && perPair <= 16) return 2;
    return 1;
  }

  /* ---------- sound ---------- */
  var audio = null, soundOn = true;
  function tone(freq, dur, type, gain){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "triangle"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.09, audio.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur + 0.02);
    }catch(e){}
  }
  /* A found pair: a fast bright arpeggio on a square wave, the way an arcade
     game rewards you for picking something up. Sine waves alone sounded
     polite; the square edge is what makes it read as a prize. */
  function matchCall(){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime;

      function bling(freq, at, dur, gain){
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "square";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(gain, t0 + at + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        o.connect(g); g.connect(audio.destination);
        o.start(t0 + at); o.stop(t0 + at + dur + 0.02);

        var w = audio.createOscillator(), wg = audio.createGain();   // a little body
        w.type = "sine";
        w.frequency.value = freq / 2;
        wg.gain.setValueAtTime(0.0001, t0 + at);
        wg.gain.exponentialRampToValueAtTime(gain * 0.5, t0 + at + 0.006);
        wg.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        w.connect(wg); wg.connect(audio.destination);
        w.start(t0 + at); w.stop(t0 + at + dur + 0.02);
      }

      bling(1047, 0.000, 0.10, 0.055);   // C
      bling(1319, 0.052, 0.10, 0.055);   // E
      bling(1568, 0.104, 0.10, 0.060);   // G
      bling(2093, 0.156, 0.42, 0.070);   // C on top, left ringing
    }catch(e){}
  }

  /* A leaf rustle for the card under the pointer: one cached noise burst,
     re-filtered each time so it never sounds mechanical. */
  var rustleBuf = null;
  function rustle(){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      if(!rustleBuf){
        var len = Math.floor(audio.sampleRate * 0.07);
        rustleBuf = audio.createBuffer(1, len, audio.sampleRate);
        var d = rustleBuf.getChannelData(0);
        for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      }
      var src = audio.createBufferSource();
      src.buffer = rustleBuf;
      var bp = audio.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 2100 + Math.random() * 1400;
      bp.Q.value = 1.1;
      var g = audio.createGain();
      g.gain.value = 0.07;
      src.connect(bp); bp.connect(g); g.connect(audio.destination);
      src.start();
    }catch(e){}
  }

  /* A card turning: a short rush of air as it swings, then the tap of its
     corner on the table. The tap is noise, not a note - a pitched one at this
     length reads as a little horn, which is not how card on wood sounds. */
  var flipBuf = null;
  function flipSound(){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime;

      if(!flipBuf){
        var len = Math.floor(audio.sampleRate * 0.13);
        flipBuf = audio.createBuffer(1, len, audio.sampleRate);
        var d = flipBuf.getChannelData(0);
        for(var i = 0; i < len; i++){
          var x = i / len;

  function sayClip(file, spoken, done){

      if(finished) return;

      if(tried){ end(); return; }

      else {

    function back(){ if(!done){ done = true; jungleDuck(false); } }

        "Q" + (tx + dx * 6 - px * 3).toFixed(1) + " " + (ty + dy * 6 - py * 3).toFixed(1) + " " +

  /* ---------- board sizing: cards take the whole area ---------- */
  function layoutBoard(){
    if(!state) return;
    var W = boardArea.clientWidth, H = boardArea.clientHeight;
    if(!W || !H) return;
    var n = state.deck.length, ratio = 4 / 3;
    var gap = Math.max(7, Math.min(16, Math.round(Math.min(W, H) * 0.016)));
    var best = null;

    /* the album is always six rows deep, except on a narrow screen */
    if(state.mode === "album" && W > 620){
      var ac = Math.ceil(n / 6);
      best = {w: Math.min((W - (ac - 1) * gap) / ac, ((H - 5 * gap) / 6) * ratio), cols: ac};
    } else {
      best = {w: 0, cols: 1};
      for(var cols = 1; cols <= n; cols++){
        var rows = Math.ceil(n / cols);

        var w = Math.min(cw, ch * ratio);
        if(w > best.w) best = {w: w, cols: cols};

    board.style.setProperty("--gap", gap + "px");

  /* A card opens in the box belonging to the side of the table that won it:

  function sideFor(id){
