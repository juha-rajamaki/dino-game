  /* More about each animal, behind the card's "More about" button: how it was
     first found, and three things worth knowing. Every line has its own clip
     in audio/more/<id>-found.mp3 and <id>-1.mp3 to -3.mp3. */
  var MORE = {
    tyrannosaurus: {found: "The fossil hunter Barnum Brown dug up the first skeleton in Montana in 1902, and Henry Fairfield Osborn named it Tyrannosaurus rex in 1905.",
      facts: ["It had a giant growth spurt as a teenager. Scientists counted growth rings in its bones, like tree rings, and found it gained about two kilograms every day for four years.",
              "The most complete skeleton ever found, nicknamed Sue, was about 33 years old when it died. Its biggest tooth is 30 centimetres long with the root, as long as a school ruler.",
              "The smelling parts of its brain were huge, the biggest of any meat-eating dinosaur scientists measured. It could probably sniff out food from far away."]},
    triceratops: {found: "Its horns were found near Denver, Colorado, in 1887. Othniel Marsh first thought they belonged to a giant bison, then named Triceratops in 1889.",
      facts: ["Its horns changed shape as it grew up. Babies had little stubs, young ones had horns that curved backwards, and adults' horns swung round to point forwards.",
              "One Triceratops hip bone carries about 80 tooth marks from a Tyrannosaurus. Scientists think the hunter bit again and again to pull the back leg off and eat it.",
              "Its mouth held hundreds of teeth packed in neat rows, like a pair of scissors for slicing tough plants. New teeth grew in to replace the old ones as they wore down."]},
    stegosaurus: {found: "Arthur Lakes found the first bones near Morrison, Colorado, in 1877, and Othniel Marsh named Stegosaurus the same year.",
      facts: ["Its name means roof lizard, because the first scientist to study it thought the plates lay flat along its back like tiles on a roof. Later fossils showed they stood upright.",
              "Scientists found an Allosaurus tail bone with a hole that exactly fits a Stegosaurus tail spike. The wound had partly healed, so the hunter survived the whack.",
              "In 2024 a Stegosaurus skeleton nicknamed Apex sold for almost 45 million dollars. That is the most money ever paid for a fossil."]},
    velociraptor: {found: "Peter Kaisen found the first skull and claw in Mongolia's Gobi Desert in 1923, on an American Museum expedition, and Henry Fairfield Osborn named it in 1924.",
      facts: ["Each foot had one huge curved claw, about as long as your finger. It held that toe up off the ground as it walked, probably to keep the claw sharp.",
              "One Velociraptor skeleton has a bone from a big flying reptile inside its belly, its last meal. Scientists think it probably scavenged a body rather than catching one.",
              "Its long tail was stiffened by thin rods of bone, a bit like a pole. That probably helped it balance as it ran, turned and pounced."]},
    brachiosaurus: {found: "H. William Menke found the first skeleton near Grand Junction, Colorado, in 1900 while digging with Elmer Riggs's team, and Riggs named it Brachiosaurus in 1903.",
      facts: ["Its thigh bone alone is about two metres long, taller than a grown-up.",
              "The famous giant skeleton in a Berlin museum was called Brachiosaurus for almost a hundred years. In 2009 scientists decided it was a different dinosaur from Africa.",
              "A full-size copy of its skeleton, nicknamed Ernestine, stands in Chicago's O'Hare airport. It is about 22 metres long, so travellers walk right under its neck."]},
    ankylosaurus: {found: "Barnum Brown's team found the first skeleton in Montana in 1906, and Brown named it Ankylosaurus in 1908.",
      facts: ["No one has ever found a complete Ankylosaurus skeleton. Scientists have only a handful of partial ones and just one tail club.",
              "For such a big animal its teeth were tiny and leaf-shaped, smaller for its size than any of its armoured relatives. It probably snipped soft plants instead of chewing tough ones.",
              "The air passages inside its snout looped round and round like a twisty straw. Scientists think this may have warmed or cooled the air, or made its calls sound louder."]},
    spinosaurus: {found: "Richard Markgraf dug up the first bones in the Egyptian desert in 1912, and the German scientist Ernst Stromer named Spinosaurus in 1915.",
      facts: ["The first Spinosaurus bones were blown to pieces by a bomb during the Second World War in 1944. For seventy years scientists had only old drawings and photographs to go on.",
              "Its bones were packed solid and heavy, like a penguin's. Scientists think this helped it sink and hunt underwater instead of bobbing about on top.",
              "A scientist bought a strange bone from a man with a moustache in Morocco. Years later he spotted the same man walking past a café, who led him to a new skeleton."]},
    parasaurolophus: {found: "A team from the University of Toronto dug up the first skeleton near Sand Creek in Alberta, Canada, in 1920, and William Parks named it in 1922.",
      facts: ["A high school student found the best baby Parasaurolophus ever, nicknamed Joe, in Utah. It was under a year old, and its famous crest was just a small bump.",
              "Scientists once wondered if the crest was a snorkel for breathing underwater. It cannot be, because there is no hole at the tip to let air in.",
              "Its mouth held hundreds of teeth packed tightly together, making a grinding surface like a rough file. It mashed up leaves and twigs before swallowing."]},
    allosaurus: {found: "Benjamin Mudge and Samuel Williston dug up the first bones at Garden Park, Colorado, in 1877, and Othniel Marsh named Allosaurus that same year.",
      facts: ["A skeleton nicknamed Big Al had 19 broken or infected bones. One badly infected toe probably made it limp, and may have been what finally killed it.",
              "Many Allosaurus bones from one Colorado quarry are covered in Allosaurus tooth marks. Scientists think that in hard, dry times they scavenged and even ate each other.",
              "It had a small bony horn in front of each eye and low ridges along its snout. Scientists think these were probably for showing off, not fighting."]},
    pachycephalosaurus: {found: "William Winkley found an almost complete skull on his ranch in Montana in 1940, and Barnum Brown and Erich Schlaikjer named it in 1943.",
      facts: ["Some scientists think spiky, flat-headed skulls once given their own names were really young Pachycephalosaurus. As they grew up, the spikes shrank and the dome swelled.",
              "A knobbly bit of its skull was dug up in 1859. A scientist guessed it came from an armadillo-like animal, and it took over a hundred years to work out the truth.",
              "Its thick skull survives far better than the rest of its body. Nobody has found a complete skeleton, so most of what we know comes from skulls and domes."]},
    therizinosaurus: {found: "Its giant claws were dug up in the Gobi Desert of Mongolia in 1948 by a Russian and Mongolian expedition, and Evgeny Maleev named it in 1954.",
      facts: ["In 2023, scientists tested computer copies of its claws and found they were probably too weak for fighting or digging. They think the giant claws may have been mostly for showing off.",
              "Its family tree is full of meat-eaters like Velociraptor, but it gave up meat and ate plants. Its close relatives had fluffy feathers, so it was probably fluffy too.",
              "In Mongolia, scientists found a nesting ground of its relatives with 17 nests side by side and eggs as big as grapefruits. Most of the babies hatched, so the parents probably guarded them."]},
    diplodocus: {found: "The first bones were dug up near Cañon City, Colorado, in 1877 by Benjamin Mudge and Samuel Williston, and Othniel Marsh named it the next year.",
      facts: ["It wore out its teeth so fast that each one was replaced about once a month. Up to five spare teeth waited in line behind every tooth in its mouth.",
              "A baby skull nicknamed Andrew showed that young Diplodocus had narrow snouts like a deer's. Scientists think the babies ate lots of different plants, while grown-ups had wide, cow-like snouts.",
              "Dippy, the famous skeleton that greeted visitors in London for over a hundred years, is a plaster copy. A rich man called Andrew Carnegie sent copies like it to about ten museums around the world."]},
    carnotaurus: {found: "Its only skeleton was found on a farm in Chubut, Argentina, in 1984 by a team led by José Bonaparte, who named it the next year.",
      facts: ["Only one skeleton has ever been found, and it came with patches of skin pressed into the rock. The skin was covered in small scales with rows of bigger bumps along its sides, and no feathers.",
              "Its eyes pointed slightly forwards, so it could probably see some things with both eyes at once, like you do. That would have helped it judge how far away its prey was.",
              "Tests on its skull suggest it could snap its jaws shut very fast, but its bite was not very strong. It probably went for smaller animals it could grab quickly."]},
    dilophosaurus: {found: "A Navajo man named Jesse Williams showed its bones in Arizona to scientists in 1942. Samuel Welles described it in 1954 and gave it the name Dilophosaurus in 1970.",
      facts: ["One skeleton had eight injuries, including a broken shoulder blade and infected bones in its arm and thumb. That is a record for a meat-eating dinosaur, and the bones had healed, so it survived for months or years.",
              "Its crests were full of air pockets linked to its nose. Birds today use air sacs like these to puff up their skin, so scientists think Dilophosaurus may have done something similar.",
              "Scientists once thought its jaws were weak. A 2020 study found marks from big, strong jaw muscles, so it was probably a powerful hunter after all."]},
    iguanodon: {found: "The first teeth were found in Sussex, England, in about 1822, probably by Mary Ann Mantell, and her husband Gideon named it in 1825 because the teeth looked like an iguana's.",
      facts: ["In 1878, coal miners in Belgium found about thirty skeletons, 322 metres underground. That is about as deep as the Eiffel Tower is tall.",
              "On New Year's Eve 1853, about twenty scientists ate a fancy dinner inside a life-size model of Iguanodon being built for the Crystal Palace park in London.",
              "Its three middle fingers were joined together like a hoof for walking on, and its little finger could bend to grab food. Scientists now think it walked on all fours most of the time."]},
    styracosaurus: {found: "The fossil collector Charles Sternberg found the first skull beside the Red Deer River in Alberta, Canada, in 1913, and Lawrence Lambe named it that same year.",
      facts: ["In 2015 a scientist found a skull and nicknamed it Hannah, after his dog. Its frill was lopsided, with seven bony points on one side and eight on the other.",
              "At the front of its mouth was a narrow, parrot-like beak for plucking plants. Behind it, rows of teeth sliced food like scissors, and new teeth kept growing to replace worn ones.",
              "In Alberta, scientists found a bone bed holding many Styracosaurus that died in the same place. They may have crowded round a waterhole during a drought."]},
    pteranodon: {found: "Othniel Marsh's team found the first wing bones in the chalk of Kansas in 1870, and Marsh named it Pteranodon in 1876.",
      facts: ["About 1,200 Pteranodon fossils have been found, more than any other flying reptile. That is why scientists know it so well.",
              "Males and females looked different. Males had big crests and wings up to seven metres wide, while females were smaller, with little crests and wider hips for laying eggs.",
              "One Pteranodon fossil still has a lump of fish between its jaws, its very last meal. It flew over a shallow sea that once covered the middle of North America."]},
    rhamphorhynchus: {found: "The first fossil came from the limestone of Bavaria, Germany, and was described in 1825 by a scientist who thought it was a bird. Hermann von Meyer named Rhamphorhynchus in 1847.",
      facts: ["Several fossils show it caught in the jaws of a big, spiky-snouted fish. Its wing probably got tangled in the fish's teeth, and both sank and died together.",
              "Its tail flap changed as it grew. Babies had a small oval flap, older ones a diamond, and the biggest adults a triangle.",
              "The rings of bone around its eyes look like those of seabirds that hunt at night. So scientists think it may have gone fishing in the dark."]},
    dimorphodon: {found: "Mary Anning found the first skeleton at Lyme Regis, Dorset, in 1828. It was the first flying reptile found outside Germany, and Richard Owen named it Dimorphodon in 1859.",
      facts: ["Its big head was surprisingly light. It was full of large holes held apart by thin struts of bone, built like the frame of a bridge.",
              "Tiny scratches on its teeth match those of lizards that hunt other small animals. So it probably ate little creatures with backbones, and maybe insects too.",
              "Its wings were short and its body sturdy, so it was probably a poor flier that made short flapping bursts, like a pheasant. Its big curved claws made it a good climber."]},
    ornithocheirus: {found: "Harry Seeley named it in 1869 from broken jaw tips dug out of a layer of rock called the Cambridge Greensand, near Cambridge, England.",
      facts: ["Its name means bird hand. The scientist who named it thought flying reptiles were the ancestors of birds, an idea we now know was wrong.",
              "In just two years, Harry Seeley gave the name Ornithocheirus to 27 different kinds of flying reptile. Today scientists agree that only one of them really belongs there.",
              "Its fossils were found by Victorian miners digging up stones rich in phosphate to make fertiliser for farms. Among the stones were broken tips of Ornithocheirus jaws."]},
    mosasaurus: {found: "The first bones came out of chalk mines near Maastricht in the Netherlands in 1764. The English geologist William Conybeare named it in 1822, after the nearby river Meuse.",
      facts: ["As well as the teeth in its jaws, it had two extra rows of teeth on the roof of its mouth. They probably worked like hooks, gripping slippery prey and pushing it down its throat.",
              "Its most famous skull was captured by the French army in 1795 as a prize of war and carried off to Paris. It is still kept in a museum there today.",
              "Mosasaurs did not crawl onto beaches to lay eggs. Baby mosasaur bones found far out at sea show that they probably gave birth to live babies in the open ocean, like whales do."]},
    argentinosaurus: {found: "A farmer, Guillermo Heredia, found the first bone on his ranch near Plaza Huincul, Argentina, in 1987, thinking it was a log turned to stone. José Bonaparte and Rodolfo Coria named it in 1993.",
      facts: ["Scientists scanned a life-size model of its skeleton and made it walk inside a computer. Its best speed came out at about 7 kilometres an hour, the pace of a brisk human walk.",
              "It shared its home with Mapusaurus, a huge meat-eater. Several Mapusaurus were found buried together, so some scientists think they hunted in packs and might even have tackled an Argentinosaurus.",
              "A full-size copy of its skeleton fills a giant hall in the museum of Plaza Huincul, the Argentine town near where it was found. Visitors look like ants beside it."]},
    gallimimus: {found: "Polish and Mongolian fossil hunters found the first bones in the Gobi Desert of Mongolia in 1963. Rinchen Barsbold, Halszka Osmólska and Ewa Roniewicz named it in 1972.",
      facts: ["One skull shows rows of thin ridges inside its beak, like the comb in a duck's bill. Some scientists think it sieved tiny food out of muddy water, but others think the ridges just helped it snip plants.",
              "Many of its bones were hollow and filled with air, like a bird's. That helped keep such a big animal light on its feet.",
              "A herd of Gallimimus stars in the 1993 film Jurassic Park, swerving together like a flock of birds. That scene helped change how people pictured dinosaurs: quick and lively, not slow and clumsy."]},
    compsognathus: {found: "The first skeleton was found in limestone in Bavaria, Germany, in the 1850s and collected by Joseph Oberndorfer. The German scientist Johann Wagner named it in 1859.",
      facts: ["Its name means elegant jaw. The scientist who first described it thought it was a strange kind of lizard, and only later did people realise it was a dinosaur.",
              "In 1868 the scientist Thomas Huxley noticed how bird-like its skeleton was. Comparing it with Archaeopteryx, he became one of the first people to suggest that birds are related to dinosaurs.",
              "The German skeleton is a youngster only about 70 centimetres long, as long as a skateboard. A bigger, grown-up skeleton was found in France around 1971."]},
    microraptor: {found: "The Chinese scientist Xu Xing and his team named it in 2000, from a fossil dug up in Liaoning province in north-east China.",
      facts: ["Other Microraptor fossils have fish, a whole lizard and the foot of a small furry mammal in their stomachs. It seems to have snapped up almost anything it could catch.",
              "More than 300 fossils of Microraptor or its close cousins sit in Chinese museums. It was probably the most common dinosaur in its ancient forest.",
              "Its tail was first seen stuck onto a fake fossil. In 1999 a magazine called it a missing link between dinosaurs and birds, until scientists showed the fossil was made from two different animals."]},
    oviraptor: {found: "George Olsen found the first skeleton in 1923 at the Flaming Cliffs in Mongolia's Gobi Desert, on an American expedition. Henry Fairfield Osborn named it in 1924.",
      facts: ["The very first skeleton had bits of a lizard inside its body, so it probably ate small animals as well as other food.",
              "It had no teeth, but two bony points stuck down from the roof of its mouth. Scientists think they may have helped it grip or crack hard food.",
              "The eggs of one of its close cousins were blue-green, a bit like a robin's. Scientists worked this out from tiny traces of colour still left in the fossil eggshells."]},
    protoceratops: {found: "Its first skull was spotted in 1922 in Mongolia's Gobi Desert by James Shackelford, the photographer of an American expedition. Walter Granger and William Gregory named it in 1923.",
      facts: ["Its eggs were soft and leathery like a turtle's, not hard like a hen's. Scientists found this out in 2020 by studying a clutch of eggs with tiny babies still curled up inside.",
              "One nest held 15 babies, all the same size, huddled together. That suggests the young stayed in the nest for a while after hatching, probably with a parent looking after them.",
              "It is one of the most common dinosaurs in the Gobi Desert. Explorers collected over 100 skeletons in just three years, from tiny babies to grown-ups."]},
    amargasaurus: {found: "Guillermo Rougier found the only skeleton in 1984, on an expedition led by José Bonaparte in Argentina. Leonardo Salgado and José Bonaparte named it in 1991.",
      facts: ["Scientists scanned its skull to study the balance organ inside its ear. It showed that it probably held its head pointing down towards the ground, just right for nibbling low plants.",
              "Its name comes from La Amarga, the place in Argentina where it was found. Amarga means “bitter” in Spanish, so its name sounds like “bitter lizard”.",
              "In 2019 scientists found a cousin, Bajadasaurus, whose neck spikes curved forward over its head. They think long spikes like these may have helped scare off meat-eaters."]},
    deinocheirus: {found: "Polish palaeontologist Zofia Kielan-Jaworowska found its giant arms in the Gobi Desert of Mongolia in 1965. Halszka Osmólska and Ewa Roniewicz named it in 1970.",
      facts: ["Its skull was about a metre long, as long as a guitar, yet it had no teeth at all, just a wide beak.",
              "Thieves dug up the skull and feet of one skeleton and sold them abroad. Scientists tracked the bones down in a private collection in Europe, and they were returned to Mongolia in 2014.",
              "Bite marks on the first fossil show that Tarbosaurus, a close cousin of Tyrannosaurus, chewed on it. That may be why the rest of the skeleton was scattered and missing for so long."]},
    elasmosaurus: {found: "Army doctor Theophilus Turner found it near Fort Wallace in Kansas, in the United States, in 1867. Edward Drinker Cope named it the following year, in 1868.",
      facts: ["When it lived, a warm, shallow sea split North America in two. That is why its bones were found in Kansas, which today is far from any ocean.",
              "Scientists think plesiosaurs like it gave birth to live babies in the water. A fossil of a cousin was found with one big baby inside, about a third as long as its mother.",
              "Its long-necked cousins swallowed stones, one with about 250 in its belly. The stones probably helped grind up food, and may have helped them balance in the water."]},
    australovenator: {found: "Its bones were found in 2006 on a cattle station near Winton in Queensland and dug up by the Australian Age of Dinosaurs team. Scott Hocknull and his colleagues named it in 2009.",
      facts: ["The scientist who named it called it the cheetah of its time. It was light and quick, and could probably run down most other animals on open ground.",
              "When scientists described it in 2009, it was the most complete meat-eating dinosaur ever found in Australia.",
              "To work out what its feet looked like with skin on, scientists scanned an emu's foot. Then they built a life-size model foot and pressed it into soft mud to make footprints."]},
    muttaburrasaurus: {found: "The cattle farmer Doug Langdon found its bones in 1963 beside the Thomson River near Muttaburra in Queensland. Scientists Alan Bartholomai and Ralph Molnar named it in 1981.",
      facts: ["Doug Langdon spotted its bones while riding out to round up his cattle. He stuffed a few pieces into his saddle bag and told his wife he had found a monster.",
              "Queenslanders picked it in a public vote, and it became the official fossil of the state of Queensland, beating eleven other fossils.",
              "It was the first Australian dinosaur to be copied in casts and built into a standing skeleton for people to see."]},
    leaellynasaura: {found: "Tom Rich and Patricia Vickers-Rich found its first bones at Dinosaur Cove in Victoria in 1987, and named it in 1989.",
      facts: ["Its fossils came from tunnels blasted into a seaside cliff in Victoria, because the rock was as hard as concrete. Around 70 volunteers, aged from 7 to 77, helped with the dig.",
              "Scientists think its winters could be bitterly cold, below freezing, and in some places the ground may have stayed frozen all year round.",
              "A skeleton thought to belong to it has more than 70 bones in its tail. Your whole backbone has only about 33."]},
    cryolophosaurus: {found: "Geologist David Elliot's team found its bones high on Mount Kirkpatrick in Antarctica in the summer of 1990 to 1991. William Hammer dug them out and named it in 1994.",
      facts: ["Long thin bones lay by its jaws, so scientists first thought it had choked on a plant-eater's neck. A later study found they were probably its own neck ribs.",
              "To get it out, the team broke up about 2,300 kilograms of rock in three weeks. That is heavier than a big car.",
              "The skeleton probably belonged to a young animal that was still growing, so grown-ups may have reached about 8 metres long."]},
    ichthyosaurus: {found: "Its name, meaning fish lizard, was first used in 1818 by Charles König of the British Museum. In 1821, Henry De la Beche and William Conybeare named its best-known kind.",
      facts: ["Mary Anning noticed odd stones inside ichthyosaur skeletons. Broken open, they held fish bones and scales. They were fossil poo, and some were black with ink from squid-like animals the ichthyosaurs had eaten.",
              "The first complete ichthyosaur skeleton ever found was an Ichthyosaurus, probably dug up by Mary Anning. A bomb destroyed it in the Second World War, but old copies later turned up in America and Germany.",
              "In 2015, scientists named a new kind of Ichthyosaurus after Mary Anning. Its fossil had sat in a museum in Doncaster for more than 30 years before anyone noticed it was new."]},
    liopleurodon: {found: "The French scientist Henri-Émile Sauvage named it in 1873 from a single tooth found near Boulogne-sur-Mer in France. Later, near-complete skeletons were dug from clay pits near Peterborough in England.",
      facts: ["Its name means smooth-sided teeth. The pointed part of the first tooth scientists studied was about 7 centimetres long, and that was without the root.",
              "A pliosaur fossil from near Peterborough, possibly a Liopleurodon, had tiny hooks from squid-like animals, fish bones and swallowed stones in its stomach.",
              "It swam with four big flippers. Scientists think this gave it a sudden burst of speed, so it could probably lunge at prey from an ambush."]},
    kronosaurus: {found: "The first fossil, a piece of jaw, was found near Hughenden in Queensland in 1899 and sent to the Queensland Museum. Heber Longman named it in 1924.",
      facts: ["Its biggest teeth, measured from tip to root, were about 30 centimetres long, as long as a school ruler.",
              "Scientists think its bite was about twice as strong as a big saltwater crocodile's bite.",
              "The famous Kronosaurus skeleton at Harvard University in America was built about 3 metres too long, using lots of plaster. Scientists nicknamed it Plasterosaurus."]},
    archelon: {found: "George Wieland found the first skeleton near the Cheyenne River in South Dakota, in the United States, in 1895, and named it the next year.",
      facts: ["From the tip of one front flipper to the other, the biggest one measured about 4 metres, almost as wide as a car is long.",
              "The first skeleton ever found is missing its right back flipper. Scientists think it was bitten off while the turtle was still alive, and it may have lived on for years afterwards.",
              "The biggest Archelon ever found, nicknamed Brigitta, was dug up in South Dakota in 1992. Today it is on show at the Natural History Museum in Vienna, Austria."]},
    brontosaurus: {found: "Othniel Marsh named it in 1879 from a huge skeleton dug up at Como Bluff in Wyoming by his collectors, led by William Reed.",
      facts: ["For fifty years, from 1931 to 1981, the famous skeleton at Yale University wore the wrong head, a short, boxy skull from a different kind of dinosaur.",
              "In 1989 Brontosaurus appeared on a United States postage stamp, and people complained that it was not a real name. Since 2015, it is again.",
              "It swallowed leaves without chewing them. Its enormous belly did the work, slowly breaking the plants down over days."]},
    giganotosaurus: {found: "Rub\u00E9n Carolini found its bones near Villa El Choc\u00F3n in Argentina in 1993, and Rodolfo Coria and Leonardo Salgado named it in 1995.",
      facts: ["Its teeth were flat like knife blades, with saw edges for slicing flesh, unlike the thick, bone-crushing teeth of Tyrannosaurus.",
              "Its skull was about as long as a grown-up is tall, but its brain was small, and scientists think it was shaped a bit like a banana.",
              "It shared its world with giant long-necked dinosaurs. Some scientists think meat-eaters like it may have hunted the young ones, or worked together to take on bigger prey."]},
    coelophysis: {found: "Edward Drinker Cope named it in 1889 from bones David Baldwin found in New Mexico in 1881. In 1947 Edwin Colbert's team found the great bone bed at Ghost Ranch.",
      facts: ["Small bones inside some skeletons made scientists think it ate its own babies. A later study showed they belonged to little crocodile-like reptiles instead.",
              "It is the state fossil of New Mexico, chosen in 1981.",
              "It had a long, narrow head full of small, saw-edged teeth, and big eyes. It probably hunted small animals like lizards."]},
    plateosaurus: {found: "Johann Engelhardt found its first bones near Nuremberg in Germany in 1834, and Hermann von Meyer named it in 1837.",
      facts: ["It could not turn its hands palms-down like you can. Its palms always faced inwards, as if it were about to clap.",
              "Growth rings in its bones show that grown-ups could be very different sizes. Some stopped growing at about five metres, others reached ten.",
              "So many have been dug out of a clay pit at Frick in Switzerland that the little town opened its own dinosaur museum."]},
    megalosaurus: {found: "Bones from a quarry at Stonesfield near Oxford were studied by William Buckland, who named Megalosaurus in 1824.",
      facts: ["A piece of bone drawn in a book in 1677 probably came from a Megalosaurus. The scientist who drew it thought it came from a giant human.",
              "In 1842 Richard Owen invented the word dinosaur, meaning terrible lizard. Megalosaurus was one of the first three animals he used it for.",
              "For a long time almost any big meat-eating dinosaur bone was called Megalosaurus. Today scientists only use the name for fossils from around Oxford."]},
    carcharodontosaurus: {found: "Its first teeth were found in Algeria and described in 1925. In 1931 the German scientist Ernst Stromer named it, from a skeleton found in Egypt.",
      facts: ["In 1995 Paul Sereno's team found a huge skull in Morocco. It was about 1.6 metres long, longer than many grown-ups are tall.",
              "Its close cousin was Giganotosaurus from South America. Their family probably split in two as Africa and South America drifted apart.",
              "Spinosaurus and at least one more big meat-eater lived in the same place at the same time. Scientists still wonder how so many giant hunters found enough to eat."]},
    archaeopteryx: {found: "A single fossil feather was found near Solnhofen in Germany in 1861, and soon after a whole skeleton. Hermann von Meyer gave it its name that same year.",
      facts: ["Scientists studied tiny traces of colour in a fossil feather, and think at least part of it was black, like a crow's.",
              "It could probably flap its wings and fly short distances, though not as well as the birds of today.",
              "One skeleton sat in a museum in the Netherlands for more than a hundred years, labelled as a flying reptile, until a scientist spotted its feathers in 1970."]},
    quetzalcoatlus: {found: "A student, Douglas Lawson, found its first wing bones in Big Bend in Texas in 1971, and named it in 1975.",
      facts: ["It is named after Quetzalcoatl, a feathered serpent god of the Aztec people of Mexico.",
              "To take off, it probably crouched down and sprang into the air using its strong arms, a bit like a pole vaulter.",
              "Its bones were hollow and filled with air, so although it was as tall as a giraffe, it weighed only about as much as two or three grown-ups."]},
    edmontosaurus: {found: "George Sternberg's team dug up the first skeleton beside the Red Deer River in Alberta, Canada, in 1912, and Lawrence Lambe named it in 1917, after the town of Edmonton.",
      facts: ["One Edmontosaurus tail bone carries a healed bite from a Tyrannosaurus. It was bitten, got away, and lived long enough for the wound to heal.",
              "In 1908 the Sternberg family of fossil hunters found an Edmontosaurus mummy in Wyoming, curled up with its skin wrapped around its bones. It is still on show in a museum in New York.",
              "Huge beds of Edmontosaurus bones have been found, holding many animals that died together. That suggests they lived in big herds, like wildebeest do today."]},
    albertosaurus: {found: "The geologist Joseph Burr Tyrrell found the first skull beside the Red Deer River in Alberta, Canada, in 1884, and Henry Fairfield Osborn named it in 1905.",
      facts: ["Growth rings in its bones show that it grew fastest as a teenager, putting on more than a hundred kilograms a year.",
              "The oldest Albertosaurus scientists have found was about 28 years old when it died, which is very old for a big meat-eating dinosaur.",
              "Its teeth were shaped like bananas with saw edges, for slicing through meat. When one broke or fell out, a new tooth grew in to take its place."]}
  };

  /* Score: a point for every pair, a bonus for guessing well, a bonus for being quick. */
  function scoreOf(st){
    var accuracy = st.turns ? st.found.length / st.turns : 0;
    return {
      accuracy: accuracy,
      match: st.found.length * 100,
      sharp: Math.round(accuracy * 500),
      quick: Math.max(0, 400 - st.seconds * 2),
      get total(){ return this.match + this.sharp + this.quick; }
    };
  }
  function starsOf(st){
    var turnRatio = st.turns / Math.max(1, st.found.length);
    var perPair = st.seconds / Math.max(1, st.found.length);
    if(turnRatio <= 1.6 && perPair <= 9) return 3;
    if(turnRatio <= 2.4 && perPair <= 16) return 2;
    return 1;
  }

  /* ---------- sound ---------- */
  var audio = null, soundOn = true;
  function tone(freq, dur, type, gain){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || "triangle"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.09, audio.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur + 0.02);
    }catch(e){}
  }
  /* A found pair: a fast bright arpeggio on a square wave, the way an arcade
     game rewards you for picking something up. Sine waves alone sounded
     polite; the square edge is what makes it read as a prize. */
  function matchCall(){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime;

      function bling(freq, at, dur, gain){
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "square";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(gain, t0 + at + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        o.connect(g); g.connect(audio.destination);
        o.start(t0 + at); o.stop(t0 + at + dur + 0.02);

        var w = audio.createOscillator(), wg = audio.createGain();   // a little body
        w.type = "sine";
        w.frequency.value = freq / 2;
        wg.gain.setValueAtTime(0.0001, t0 + at);
        wg.gain.exponentialRampToValueAtTime(gain * 0.5, t0 + at + 0.006);
        wg.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
        w.connect(wg); wg.connect(audio.destination);
        w.start(t0 + at); w.stop(t0 + at + dur + 0.02);
      }

      bling(1047, 0.000, 0.10, 0.055);   // C
      bling(1319, 0.052, 0.10, 0.055);   // E
      bling(1568, 0.104, 0.10, 0.060);   // G
      bling(2093, 0.156, 0.42, 0.070);   // C on top, left ringing
    }catch(e){}
  }

  /* A leaf rustle for the card under the pointer: one cached noise burst,
     re-filtered each time so it never sounds mechanical. */
  var rustleBuf = null;
  function rustle(){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      if(!rustleBuf){
        var len = Math.floor(audio.sampleRate * 0.07);
        rustleBuf = audio.createBuffer(1, len, audio.sampleRate);
        var d = rustleBuf.getChannelData(0);
        for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      }
      var src = audio.createBufferSource();
      src.buffer = rustleBuf;
      var bp = audio.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 2100 + Math.random() * 1400;
      bp.Q.value = 1.1;
      var g = audio.createGain();
      g.gain.value = 0.07;
      src.connect(bp); bp.connect(g); g.connect(audio.destination);
      src.start();
    }catch(e){}
  }

  /* A card turning: a short rush of air as it swings, then the tap of its
     corner on the table. The tap is noise, not a note - a pitched one at this
     length reads as a little horn, which is not how card on wood sounds. */
  var flipBuf = null;
  function flipSound(){
    if(!soundOn) return;
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime;

      if(!flipBuf){
        var len = Math.floor(audio.sampleRate * 0.13);
        flipBuf = audio.createBuffer(1, len, audio.sampleRate);
        var d = flipBuf.getChannelData(0);
        for(var i = 0; i < len; i++){
          var x = i / len;
          d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * x) * (1 - x * 0.35);
        }
      }

      var air = audio.createBufferSource();
      air.buffer = flipBuf;
      air.playbackRate.value = 1;
      var sweep = audio.createBiquadFilter();
      sweep.type = "bandpass";
      sweep.Q.value = 0.9;
      sweep.frequency.setValueAtTime(700, t0);
      sweep.frequency.exponentialRampToValueAtTime(2600, t0 + 0.1);
      var ag = audio.createGain();
      ag.gain.value = 0.11;
      air.connect(sweep); sweep.connect(ag); ag.connect(audio.destination);
      air.start(t0);

      var tap = audio.createBufferSource();
      tap.buffer = flipBuf;
      tap.playbackRate.value = 2.6;
      var bodyf = audio.createBiquadFilter();
      bodyf.type = "bandpass";
      bodyf.frequency.value = 1280;
      bodyf.Q.value = 0.8;
      var tg = audio.createGain();
      tg.gain.setValueAtTime(0.0001, t0 + 0.082);
      tg.gain.exponentialRampToValueAtTime(0.16, t0 + 0.09);
      tg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      tap.connect(bodyf); bodyf.connect(tg); tg.connect(audio.destination);
      tap.start(t0 + 0.082);
    }catch(e){}
  }

  var swooshBuf = null;
  function swoosh(){
    if(!soundOn) return;
    tone(988, 0.12, "square", 0.06);
    setTimeout(function(){ tone(740, 0.16, "square", 0.06); }, 120);
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === "suspended") audio.resume();
      var t0 = audio.currentTime + 0.3;
      if(!swooshBuf){
        var len = Math.floor(audio.sampleRate * 0.9);
        swooshBuf = audio.createBuffer(1, len, audio.sampleRate);
        var d = swooshBuf.getChannelData(0);
        for(var i = 0; i < len; i++){ var x = i / len; d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * x); }
      }
      var src = audio.createBufferSource();
      src.buffer = swooshBuf;
      var bp = audio.createBiquadFilter();
      bp.type = "bandpass"; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(500, t0);
      bp.frequency.exponentialRampToValueAtTime(2400, t0 + 0.45);
      bp.frequency.exponentialRampToValueAtTime(700, t0 + 0.9);
      var g = audio.createGain();
      g.gain.value = 0.14;
      src.connect(bp); bp.connect(g); g.connect(audio.destination);
      src.start(t0);
    }catch(e){}
  }

  /* The asteroid, in two parts. While it falls, a roar of air that climbs and
     thickens as it comes. When it lands: a crack that has no pitch, a boom that
     drops out of hearing into the floor, a body of churned earth, then a long
     rumble with stones still coming down, all in a big open space. Everything
     runs through one bus, so leaving the asteroid fades the lot. */
  var quakeBuf = null, quakeHall = null, quakeBus = null;
  function quakeReady(){
    if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === "suspended") audio.resume();
    var sr = audio.sampleRate;
    if(!quakeBuf){
      /* brown noise: white noise run through a leaky sum, all weight and no hiss */
      var len = Math.floor(sr * 7), last = 0;
      quakeBuf = audio.createBuffer(2, len, sr);
      for(var ch = 0; ch < 2; ch++){
        var d = quakeBuf.getChannelData(ch); last = 0;
        for(var i = 0; i < len; i++){
          last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
          d[i] = last * 3.5;
        }
      }
    }
    if(!quakeHall){
      /* a canyon of a room: four seconds of decaying noise, darker as it fades */
      var hl = Math.floor(sr * 4);
      quakeHall = audio.createBuffer(2, hl, sr);
      for(var c = 0; c < 2; c++){
        var h = quakeHall.getChannelData(c), lp = 0;
        for(var j = 0; j < hl; j++){
          var x = j / hl, k = 0.5 - 0.42 * x;
          lp += k * ((Math.random() * 2 - 1) - lp);
          h[j] = lp * Math.pow(1 - x, 3);
        }
      }
    }
  }
  function quakeOut(){
    /* each asteroid gets its own bus; the old one is let go */
    var t = audio.currentTime;
    var bus = audio.createGain();
    bus.gain.value = 0.9;
    var squash = audio.createDynamicsCompressor();
    squash.threshold.value = -16; squash.knee.value = 8; squash.ratio.value = 6;
    squash.attack.value = 0.004; squash.release.value = 0.35;
    var hall = audio.createConvolver(), wet = audio.createGain(), dry = audio.createGain();
    hall.buffer = quakeHall; wet.gain.value = 0.55; dry.gain.value = 0.85;
    bus.connect(dry); bus.connect(hall); hall.connect(wet);
    dry.connect(squash); wet.connect(squash); squash.connect(audio.destination);
    quakeBus = {bus: bus, born: t};
    return bus;
  }
  function noise(at, dur, rate){
    var src = audio.createBufferSource();
    src.buffer = quakeBuf;
    src.playbackRate.value = rate || 1;
    src.start(at, Math.random() * 2, dur * (rate || 1));   /* dur in seconds heard */
    return src;
  }
  function quakeStop(){
    if(!quakeBus || !audio) return;
    var g = quakeBus.bus.gain, t = audio.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0, t + 0.6);
    var bus = quakeBus.bus;
    setTimeout(function(){ try{ bus.disconnect(); }catch(e){} }, 700);
    quakeBus = null;
  }
  /* the fall: `dur` seconds of rushing air, louder and brighter as it nears */
  function asteroidFall(dur){
    if(!soundOn) return;
    try{
      quakeReady();
      quakeStop();
      var bus = quakeOut(), t0 = audio.currentTime;
      var air = noise(t0, dur + 0.1, 1);
      var bp = audio.createBiquadFilter();
      bp.type = "bandpass"; bp.Q.value = 0.7;
      bp.frequency.setValueAtTime(180, t0);
      bp.frequency.exponentialRampToValueAtTime(1600, t0 + dur);
      var g = audio.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + dur * 0.92);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.08);
      air.connect(bp); bp.connect(g); g.connect(bus);
      /* under the air, a low engine-like groan rising to meet the ground */
      var groan = audio.createOscillator(), gg = audio.createGain(), gl = audio.createBiquadFilter();
      groan.type = "sawtooth";
      groan.frequency.setValueAtTime(38, t0);
      groan.frequency.exponentialRampToValueAtTime(95, t0 + dur);
      gl.type = "lowpass"; gl.frequency.value = 260;
      gg.gain.setValueAtTime(0.0001, t0);
      gg.gain.exponentialRampToValueAtTime(0.14, t0 + dur * 0.95);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.05);
      groan.connect(gl); gl.connect(gg); gg.connect(bus);
      groan.start(t0); groan.stop(t0 + dur + 0.1);
    }catch(e){}
  }
  /* the landing */
  function asteroidBoom(){
    if(!soundOn) return;
    try{
      quakeReady();
      var bus = quakeBus && audio.currentTime - quakeBus.born < 4 ? quakeBus.bus : quakeOut();
      var t0 = audio.currentTime + 0.01;

      /* the crack: a split second of everything at once */
      var crack = noise(t0, 0.25, 4);
      var hp = audio.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 900;
      var cg = audio.createGain();
      cg.gain.setValueAtTime(0.0001, t0);
      cg.gain.exponentialRampToValueAtTime(0.9, t0 + 0.004);
      cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      crack.connect(hp); hp.connect(cg); cg.connect(bus);

      /* the boom: a sine that falls from a punch to below hearing */
      [[1, 0.95], [1.5, 0.35]].forEach(function(p){
        var o = audio.createOscillator(), og = audio.createGain();
        o.type = "sine";
        o.frequency.setValueAtTime(110 * p[0], t0);
        o.frequency.exponentialRampToValueAtTime(42 * p[0], t0 + 0.25);
        o.frequency.exponentialRampToValueAtTime(24 * p[0], t0 + 2.2);
        og.gain.setValueAtTime(0.0001, t0);
        og.gain.exponentialRampToValueAtTime(p[1], t0 + 0.012);
        og.gain.exponentialRampToValueAtTime(p[1] * 0.4, t0 + 0.5);
        og.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
        o.connect(og); og.connect(bus);
        o.start(t0); o.stop(t0 + 2.7);

      else if(mv.picked) pickOnMap(mv.picked, true);
      else flyTo(wholeWorld());   /* and look at who lives here now */
    }
    if(reduceMotion.matches || Math.abs(from - age) < 0.5 || !frameReady(Math.max(0, Math.min(220, Math.floor(from / 5) * 5)))){ arrive(); return; }
    paintDrift(from);
    driftCanvas.dataset.on = "true";
    mapImgs.now.dataset.on = mapImgs[220].dataset.on = mapImgs[150].dataset.on = mapImgs[70].dataset.on = mapImgs[66].dataset.on = "false";
    mapUnder.style.opacity = "0";
    var t0 = performance.now(), dur = 900 + Math.abs(age - from) * 16;
    function step(now){
      var k = Math.min(1, (now - t0) / dur);
      var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      mv.anim = from + (age - from) * e;
      paintDrift(mv.anim);
      countYears(mv.anim);
      drawMap();
      if(k < 1) mv.drift = requestAnimationFrame(step);
      else { mv.drift = null; arrive(); }
    }
    mv.drift = requestAnimationFrame(step);
  }

  /* ---------- the asteroid ---------- */
  function clearImpact(keepFallout){
    mv.gen++;   /* a rock still falling from before lands nowhere */
    if(!keepFallout) mapFallout.textContent = "";
    quakeStop();
    mv.impact.forEach(function(h){ clearTimeout(h); });
    mv.impact = [];
    mapImpact.textContent = "";
    mapDust.dataset.on = "false";
    mv.extinct = false;
  }
  /* The rock streaks in from the top corner, the world flashes, rings of fire
     spread from where it hit, dust darkens the sky, and the animals of the
     Cretaceous go grey, the nearest first. */
  function impact(){
    clearImpact();
    var gen = mv.gen;
    var spot = project(IMPACT);
    /* see the whole of it: the Americas and the sea it fell into */
    var view = {s: wholeWorld().s, cx: spot.x, cy: spot.y};
    if(mv.picked){ mv.picked = null; paintMapCard(); }
    flyTo(view);
    var later = function(ms, fn){ mv.impact.push(setTimeout(fn, ms)); };
    later(reduceMotion.matches ? 0 : 850, function(){
      var c = toScreen(spot);
      mapDust.style.setProperty("--x", c.x + "px");
      mapDust.style.setProperty("--y", c.y + "px");
      if(reduceMotion.matches){ land(); return; }
      asteroidFall(1.5);
      /* the streak: in from the top right, over a second and a half */
      var sx = mv.W + 60, sy = -60, dx = c.x - sx, dy = c.y - sy;
      var len = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx);
      var tail = document.createElement("div"), rock = document.createElement("div");
      tail.className = "meteor-tail"; rock.className = "meteor";
      mapImpact.appendChild(tail); mapImpact.appendChild(rock);
      var t0 = performance.now(), dur = 1500;
      (function fall(now){
        if(gen !== mv.gen) return;
        var k = Math.min(1, (now - t0) / dur), e = k * k;
        var x = sx + dx * e, y = sy + dy * e, tl = Math.min(260, len * e);
        rock.style.transform = "translate(" + x + "px," + y + "px)";
        tail.style.width = tl + "px";
        tail.style.transform = "translate(" + x + "px," + y + "px) rotate(" + (ang + Math.PI) + "rad)";
        if(k < 1) requestAnimationFrame(fall);
        else { mapImpact.textContent = ""; land(); }
      })(t0);
    });
    function land(){
      if(gen !== mv.gen || mapEl.hidden || mv.stage !== "asteroid") return;
      var c = toScreen(spot);   /* where it is now, if the view moved while it fell */
      asteroidBoom();
      if(!reduceMotion.matches){
        var flash = document.createElement("div");
        flash.className = "flash";
        mapImpact.appendChild(flash);
        ["", " two"].forEach(function(two){
          var ring = document.createElement("div");
          ring.className = "blast" + two;
          ring.style.left = c.x + "px"; ring.style.top = c.y + "px";
          mapImpact.appendChild(ring);
        });
        debris(c);
      }
      smoke(c);
      mapDust.dataset.on = "true";
      mv.extinct = true;
      drawMap();
      later(3200, function(){ mapImpact.textContent = ""; });
    }
    function toWorld(x, y){ return {x: (x - mv.tx) / mv.s, y: (y - mv.ty) / mv.s}; }
    /* Black smoke over the crater: a heap of soft puffs, each rolling on its
       own, the whole cloud swelling slowly for most of a minute. */
    function smoke(c){
      var w = toWorld(c.x, c.y), size = Math.max(mv.W, mv.H) * 0.34 / mv.s;
      var cloud = document.createElement("div");
      cloud.className = "smoke";
      cloud.style.width = cloud.style.height = size + "px";
      cloud.style.left = (w.x - size / 2) + "px"; cloud.style.top = (w.y - size / 2) + "px";
      var puffs = mv.W < 500 ? 5 : 9, still = reduceMotion.matches;
      for(var i = 0; i < puffs; i++){
        var puff = document.createElement("i"), ps = 38 + Math.random() * 34;
        var a = Math.random() * Math.PI * 2, r = i ? 10 + Math.random() * 22 : 0;
        puff.style.width = puff.style.height = ps + "%";
        puff.style.left = (50 + Math.cos(a) * r - ps / 2) + "%";
        puff.style.top = (50 + Math.sin(a) * r * 0.8 - ps / 2) + "%";
        cloud.appendChild(puff);
        if(still || !puff.animate) continue;
        /* each puff rolls on its own for about a minute, then settles */
        var t = 6000 + Math.random() * 6000, dx = (Math.random() * 2 - 1) * 8, dy = (Math.random() * 2 - 1) * 8;
        puff.animate([{transform: "translate(0,0) scale(1)"},
                      {transform: "translate(" + dx.toFixed(1) + "%," + dy.toFixed(1) + "%) scale(1.18)"}],
                     {duration: t, iterations: Math.ceil(60000 / t), direction: "alternate", easing: "ease-in-out"});
      }
      mapFallout.appendChild(cloud);
      if(!still && cloud.animate){
        cloud.animate([{transform: "scale(.08)", opacity: 0}, {opacity: 1, offset: 0.04}, {transform: "scale(1)", opacity: 1}],
                      {duration: 45000, easing: "cubic-bezier(.2,.6,.3,1)", fill: "forwards"});
      }
    }
    /* Rocks and sparks thrown out every way from where it hit. Seen from above,
       each one rises towards us as it flies (it grows), then falls back and
       shrinks; the sparks go further and faster and burn out on the way. */
    function debris(c){
      if(!document.body.animate) return;   /* too old a browser: the blast without the bits */
      var reach = Math.max(mv.W, mv.H), many = mv.W < 500 ? 0.6 : 1;   /* a phone gets fewer */
      function throwOne(cls, size, far, dur, spin){
        var el = document.createElement("div");
        el.className = cls;
        el.style.width = size + "px"; el.style.height = size * (0.6 + Math.random() * 0.5) + "px";
        el.style.marginLeft = el.style.marginTop = (-size / 2) + "px";
        if(cls === "rock"){
          var r = function(){ return 25 + Math.round(Math.random() * 50) + "%"; };
          el.style.borderRadius = r() + " " + r() + " " + r() + " " + r();
        }
        mapImpact.appendChild(el);
        var ang = Math.random() * Math.PI * 2, dist = reach * far * (0.4 + Math.random() * 0.6);
        var lift = 0.3 + Math.random() * 0.7, turn = (Math.random() * 2 - 1) * spin;
        var frames = [];
        for(var i = 0; i <= 10; i++){
          var k = i / 10, out = 1 - Math.pow(1 - k, 2.2);   /* fast out, slowing in the air */
          var up = 4 * k * (1 - k);                           /* up and back down again */
          frames.push({
            transform: "translate(" + (c.x + Math.cos(ang) * dist * out) + "px," +
                       (c.y + Math.sin(ang) * dist * out - up * dist * 0.18) + "px) rotate(" + (turn * k) + "deg) scale(" + (0.5 + up * lift) + ")",
            opacity: cls === "rock" || k < 0.75 ? 1 : (1 - k) * 4
          });
        }
        var run = el.animate(frames, {duration: dur, delay: Math.random() * 180, easing: "linear", fill: "both"});
        if(cls === "rock"){
          /* it comes down and stays, still hot, cooling to dark stone */
          var endX = c.x + Math.cos(ang) * dist, endY = c.y + Math.sin(ang) * dist;
          run.onfinish = function(){
            if(gen !== mv.gen) return;
            run.cancel();   /* let go of the flight's last frame, or it stays on top */
            el.remove();
            var w = toWorld(endX, endY);
            el.style.transform = "translate(" + w.x + "px," + w.y + "px) rotate(" + turn + "deg) scale(" + (0.5 / mv.s) + ")";
            mapFallout.appendChild(el);
            setTimeout(function(){ el.dataset.cold = "true"; }, 60);
          };
        }
      }
      for(var i = 0; i < 70 * many; i++) throwOne("rock", 1.5 + Math.random() * 3.5, 0.28, 1700 + Math.random() * 1200, 720);
      for(var j = 0; j < 60 * many; j++) throwOne("ember", 2 + Math.random() * 3, 0.45, 1100 + Math.random() * 1300, 0);
    }
  }

  function makePins(){

      pin.appendChild(bone);

  var SVGNS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs){
    var el = document.createElementNS(SVGNS, tag);
    for(var k in attrs) el.setAttribute(k, attrs[k]);

  }

  /* Everything that moves with the view: the world itself, then each pin.
     Pins keep their size whatever the zoom, so where several animals were
     found in one place they are eased apart and tied back to it by a thread. */
  function drawMap(){
    mapWorld.style.transform = mapFallout.style.transform = "translate(" + mv.tx + "px," + mv.ty + "px) scale(" + mv.s + ")";
    var crater = toScreen(project(IMPACT)), craterX = crater.x, craterY = crater.y;
    var age = shownAge(), list = [];
    SPECIES.forEach(function(dino, i){
      var pin = mv.pins[dino.id];
      var on = shown(dino);
      pin.dataset.gone = String(!on);
      pin.tabIndex = on ? 0 : -1;
      if(!on){ pin.dataset.fossil = "false"; return; }
      var a = toScreen(project(SITES[dino.id][0], mv.then ? age : ageOf(dino)));
      /* animals found on the very same spot start apart, round a little circle */
      var ang = i * 2.39996;
      list.push({dino: dino, pin: pin, ax: a.x, ay: a.y, x: a.x + Math.cos(ang) * 0.5, y: a.y + Math.sin(ang) * 0.5});
    });
    var gap = mv.pin + 4;
    for(var it = 0; it < 40; it++){
      for(var i = 0; i < list.length; i++){
        for(var j = i + 1; j < list.length; j++){
          var p = list[i], q = list[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
          if(d >= gap) continue;
          if(d < 0.01){ dx = 1; dy = 0; d = 1; }
          var push = (gap - d) / 2 / d;
          p.x -= dx * push; p.y -= dy * push; q.x += dx * push; q.y += dy * push;
        }
      }
      list.forEach(function(p){ p.x += (p.ax - p.x) * 0.06; p.y += (p.ay - p.y) * 0.06; });
    }
    /* Antarctica sits on the bottom edge of the world: a pin there stands
       just above the row of continents, tied down to its spot */
    var floor = mv.H - 52 - mv.pin / 2, ceil = mv.pin / 2 + 6;
    list.forEach(function(p){
      if(p.ay > -mv.pin && p.ay < mv.H + mv.pin) p.y = Math.max(ceil, Math.min(floor, p.y));
    });

    mapUnder.textContent = "";
    var picked = mv.picked ? byId(mv.picked) : null;
    if(picked && shown(picked)){
      SITES[picked.id].forEach(function(site){
        var c = toScreen(project(site, mv.then ? age : ageOf(picked)));
        mapUnder.appendChild(svgEl("circle", {"class": "halo", cx: c.x, cy: c.y, r: Math.max(46, Math.min(170, 34 * mv.s))}));
        mapUnder.appendChild(svgEl("circle", {"class": "ring", cx: c.x, cy: c.y, r: 16}));
      });
    }
    list.forEach(function(p){
      if(Math.abs(p.x - p.ax) + Math.abs(p.y - p.ay) > 3)
        mapUnder.appendChild(svgEl("line", {x1: p.ax, y1: p.ay, x2: p.x, y2: p.y}));
      mapUnder.appendChild(svgEl("circle", {"class": "spot", cx: p.ax, cy: p.ay, r: 3.5}));
      p.pin.style.transform = "translate(" + p.x.toFixed(1) + "px," + p.y.toFixed(1) + "px)";
      if(picked) p.pin.dataset.dim = String(p.dino.id !== picked.id); else delete p.pin.dataset.dim;
      p.pin.dataset.picked = String(!!picked && p.dino.id === picked.id);
      /* the nearer the blast, the sooner gone */
      if(mv.extinct){
        var d = Math.hypot(p.ax - craterX, p.ay - craterY);
        p.pin.style.transitionDelay = Math.min(2.2, d / 500).toFixed(2) + "s";
        p.pin.dataset.extinct = "true";
      } else { p.pin.dataset.extinct = "false"; p.pin.style.transitionDelay = ""; }
      /* today, they are only bones - already while the land is still coming home */
      p.pin.dataset.fossil = String(mv.stage === "today");
    });
    /* where it hit, from the moment it lands and for ever after */
    if((mv.stage === "asteroid" && mv.extinct) || (mv.stage === "today" && mv.told && mv.anim === null)){
      mapUnder.appendChild(svgEl("circle", {"class": "crater", cx: craterX, cy: craterY, r: Math.max(10, 7 * mv.s)}));
      var cl = svgEl("text", {"class": "site-name", x: craterX + Math.max(10, 7 * mv.s) + 6, y: craterY + 4});
      cl.textContent = "Where the asteroid hit";
      mapUnder.appendChild(cl);
    }
    if(picked && shown(picked)){
      var placed = [];
      SITES[picked.id].forEach(function(site){
        var c = toScreen(project(site, mv.then ? age : ageOf(picked)));
        /* two places close together get their names one under the other */
        var y = c.y + 26;
        placed.forEach(function(q){ if(Math.abs(q.x - c.x) < 170 && Math.abs(q.y - y) < 16) y = q.y + 16; });
        placed.push({x: c.x, y: y});
        var label = svgEl("text", {"class": "site-name", x: c.x + 12, y: y});
        label.textContent = site[0];
        mapUnder.appendChild(label);
      });
    }
  }

  /* pick an animal (or nobody), and with fly go and look at where it lived */
  function pickOnMap(id, fly){
    var dino = id ? byId(id) : null;
    mv.picked = dino ? dino.id : null;
    if(dino && mv.then && mv.period !== dino.period){
      stopRun();
      paintMapCard();
      worldTo(stageOf(dino), speakingSide === 4 && speakingId ? stageById(stageOf(dino)).say : null);
      return;
    }
    paintMapCard();
    if(dino && fly){
      var age = mv.then ? shownAge() : ageOf(dino);
      flyTo(framing(SITES[dino.id].map(function(site){ return project(site, age); })));
    } else if(!dino) settle();
    else drawMap();
  }

  /* With the card put away the world may no longer hang off the edge where it
     sat, so it glides back into place rather than snapping on the next drag. */
  function settle(){
    stopFly();
    var tx0 = mv.tx, ty0 = mv.ty;
    clampView();
    var tx1 = mv.tx, ty1 = mv.ty;
    if(reduceMotion.matches || (Math.abs(tx1 - tx0) < 1 && Math.abs(ty1 - ty0) < 1)){ drawMap(); return; }
    mv.tx = tx0; mv.ty = ty0;
    var t0 = performance.now(), dur = 380;
    function step(now){
      var t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      mv.tx = tx0 + (tx1 - tx0) * e; mv.ty = ty0 + (ty1 - ty0) * e;
      drawMap();
      mv.fly = t < 1 ? requestAnimationFrame(step) : null;
    }
    mv.fly = requestAnimationFrame(step);
  }

  /* the stories said out loud, one after the other; done is called only if
     the last one is heard to the end */
  function tellStory(keys, done){
    keys = keys.slice();
    storyGoesOn = true;
    try{ stopSpeech(); } finally { storyGoesOn = false; }
    stopName();
    stopTurn();
    if(!soundOn){
      /* nothing to hear, so a whole story reads the caption at its own pace */
      clearTimeout(tellStory.quiet);
      if(done) tellStory.quiet = setTimeout(done, keys[0] === "asteroid" ? 9000 : 7000);
      return;
    }
    function next(){
      var key = keys.shift();

  /* ---------- card back: a three-toed theropod track ---------- */
  var trackNode = (function(){
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "-50 -58 100 116");
    svg.setAttribute("class", "track");
    svg.setAttribute("aria-hidden", "true");

    var heel = document.createElementNS(NS, "ellipse");
    heel.setAttribute("cx", "0"); heel.setAttribute("cy", "34");
    heel.setAttribute("rx", "17"); heel.setAttribute("ry", "15");
    svg.appendChild(heel);

    // a theropod track: the middle toe runs longest, every toe ends in a claw
    [[-40, 0.86], [0, 1.18], [40, 0.86]].forEach(function(toe){
      var deg = toe[0], k = toe[1];
      var a = deg * Math.PI / 180;
      var dx = Math.sin(a), dy = -Math.cos(a);
      var base = {x: 0, y: 26};
      var cx = base.x + dx * 24 * k, cy = base.y + dy * 24 * k;
      var pad = document.createElementNS(NS, "ellipse");
      pad.setAttribute("cx", cx.toFixed(1)); pad.setAttribute("cy", cy.toFixed(1));
      pad.setAttribute("rx", "7.5"); pad.setAttribute("ry", (21 * k).toFixed(1));
      pad.setAttribute("transform", "rotate(" + deg + " " + cx.toFixed(1) + " " + cy.toFixed(1) + ")");
      svg.appendChild(pad);

      var tx = base.x + dx * 44 * k, ty = base.y + dy * 44 * k;   // claw, growing off the toe tip
      var px = -dy, py = dx;
      var claw = document.createElementNS(NS, "path");
      claw.setAttribute("d",
        "M" + (tx + px * 6.5).toFixed(1) + " " + (ty + py * 6.5).toFixed(1) +
        "Q" + (tx + dx * 8).toFixed(1) + " " + (ty + dy * 8).toFixed(1) + " " +
              (tx + dx * 17).toFixed(1) + " " + (ty + dy * 17).toFixed(1) +
        "Q" + (tx + dx * 6 - px * 3).toFixed(1) + " " + (ty + dy * 6 - py * 3).toFixed(1) + " " +
              (tx - px * 6.5).toFixed(1) + " " + (ty - py * 6.5).toFixed(1) + "Z");

    });

  /* ---------- helpers ---------- */
  function shuffle(list){

  /* ---------- board sizing: cards take the whole area ---------- */
  function layoutBoard(){
    if(!state) return;
    var W = boardArea.clientWidth, H = boardArea.clientHeight;
    if(!W || !H) return;
    var n = state.deck.length, ratio = 4 / 3;
    var gap = Math.max(7, Math.min(16, Math.round(Math.min(W, H) * 0.016)));
    var best = null;

    /* the album is always six rows deep, except on a narrow screen */
    if(state.mode === "album" && W > 620){
      var ac = Math.ceil(n / 6);
      best = {w: Math.min((W - (ac - 1) * gap) / ac, ((H - 5 * gap) / 6) * ratio), cols: ac};
    } else {
      best = {w: 0, cols: 1};
      for(var cols = 1; cols <= n; cols++){
        var rows = Math.ceil(n / cols);
        var cw = (W - (cols - 1) * gap) / cols;
        var ch = (H - (rows - 1) * gap) / rows;
        if(cw <= 0 || ch <= 0) continue;
        var w = Math.min(cw, ch * ratio);
        if(w > best.w) best = {w: w, cols: cols};
      }
    }
    var cardW = Math.max(56, Math.floor(Math.min(best.w, 470)));
    board.style.setProperty("--cols", best.cols);
    board.style.setProperty("--gap", gap + "px");
    board.style.setProperty("--card-w", cardW + "px");
    board.style.setProperty("--card-h", Math.round(cardW / ratio) + "px");
  }

  /* The board waits behind the animals; the first card turned brings it forward.

  function stepForward(card){
    if(board.dataset.forward === "true") return;

    var count = (state && state.deck) ? state.deck.length : 0;
    var rows = Math.max(1, Math.ceil(count / cols));
    var fx = (cols - 1) / 2, fy = (rows - 1) / 2;   /* out from the middle of the table */
    if(card){ var from = Number(card.dataset.index); fx = from % cols; fy = Math.floor(from / cols); }

  function sideFor(id){

  var popped = {};   /* a badge pops in once, the first time it is drawn */

  /* who won a pair, read back off the deck the pair came from */
  function finderOf(id){
    for(var i = 0; i < state.deck.length; i++){
      if(state.deck[i].id === id) return state.deck[i].by || 0;
    }
    return 0;
  }

  /* On a wide screen the players sit across the table from each other and each
     one's cards lie on their own side: seats one and three to the left, two and
     four to the right. A phone has only one side, so everything stacks there,
     every pile first and then the one box. */
  /* the stylesheet's own query, word for word, so the two can never disagree */
  var oneSide = window.matchMedia("(max-width:980px), (orientation:portrait)");
  /* how many players sit on each side, which decides how the height is shared */
  function markSeats(){
    var narrow = oneSide.matches, n = (state && state.players) || 1;
    rail.dataset.seats = String(narrow ? 1 : Math.ceil(n / 2));
    rail2.dataset.seats = String(narrow ? 1 : Math.floor(n / 2));
  }

  function placeSeats(){
    var narrow = oneSide.matches;

      rail.appendChild(sheetHide);

      rail.appendChild(BOXES[0].panel);
      rail.appendChild(BOXES[1].panel);

       then the box they share, then the other player's cards below it. */

    rail.appendChild(BOXES[0].panel);
    rail.appendChild(SEATS[2].pilePanel);
    rail2.appendChild(SEATS[1].pilePanel);
    rail2.appendChild(BOXES[1].panel);
    rail2.appendChild(SEATS[3].pilePanel);

  else if(oneSide.addListener) oneSide.addListener(placeSeats);

  /* Every card you have collected, smallest first look, click to read it again. */
  function fillPile(seat, who){

    grid.textContent = "";
    var mine = state.found.filter(function(id){ return !who || finderOf(id) === who; });
    panel.hidden = mine.length === 0;

  function renderPile(){

    cardsTab.hidden = !show;

  /* Who has won: most pairs, and anybody who let their clock run out cannot,
     however far ahead they were. More than one on top is a tie. */
  function standings(){

    for(var i = 0; i < state.players; i++){
      if(state.timeout === i) continue;
      if(state.scores[i] > best){ best = state.scores[i]; winners = [i]; }
      else if(state.scores[i] === best) winners.push(i);

    return {best: best, winners: winners};
  }

  /* a speedrun keeps a best of its own */

  function recordBest(){

      saveBest(all);

  function renderBanner(){

  /* ---------- game ---------- */
  function clearFlipTimer(){
    if(state) state.holding = false;

  }
  /* Two players share the board but not the clock: each has a budget of their
     own, and it only runs down while the turn is theirs. Run it out and the
     game is over, however many pairs you were ahead by. */
  function paintClocks(){
    if(!state || !state.clocks) return;
    /* alone, the countdown lives in the timer chip */
    if(state.players < 2){
      if(!timerValue) return;
      timerValue.textContent = timeText(state.clocks[0]);
      timerValue.parentNode.setAttribute("aria-label", timeText(state.clocks[0]) + " left");
      timerValue.parentNode.dataset.low = String(state.clocks[0] <= 30);
      return;
    }
    for(var i = 0; i < state.players; i++){
      if(!clockVal[i]) continue;
      clockVal[i].textContent = timeText(state.clocks[i]);
      clockVal[i].setAttribute("aria-label",
        "Player " + (i + 1) + " has " + timeText(state.clocks[i]) + " left");
      clockVal[i].parentNode.dataset.low = String(state.clocks[i] <= 30);
    }
  }

  function timeUp(){
    closeViewer();   /* the end of the game is not hidden behind a picture */
    closeMap();      /* nor behind the map */
    stopClock();
    clearFlipTimer();
    lock = true;
    state.won = true;
    state.timeout = state.turn;
    if(state.players < 2){
      live.textContent = "Time's up! You found " + state.found.length + " of " + state.pairs + " pairs.";
    } else {
      var st = standings();
      live.textContent = "Player " + (state.turn + 1) + " has run out of time. " +
        (st.winners.length === 1 ? "Player " + (st.winners[0] + 1) + " wins!" : "It's a tie!");
    }
    renderScore(); renderBanner();
    setTimeout(sfx.win, 260);
    setTimeout(sayWin, 1150);
  }

  function startClock(){
    if(state.running) return;
    state.running = true;
    tickHandle = setInterval(function(){
      state.seconds++;
      if(timerValue && !state.clocks) timerValue.textContent = timeText(state.seconds);
      /* nobody's clock runs while the two cards of a miss are still face up:
         the player who turned them is done, and the next one cannot move yet */
      if(state.clocks && !state.won && !state.holding){
        state.clocks[state.turn] = Math.max(0, state.clocks[state.turn] - 1);
        paintClocks();
        var left = state.clocks[state.turn];
        if(left > 0 && left <= 10) sfx.tick(left);
        if(state.clocks[state.turn] === 0) timeUp();
      }
      /* the cards sit still until a quarter of the pairs are found; then a
         pair swaps every half-minute, from half found every ten seconds,
         and with a quarter left two pairs at a time */
      var share = state.found.length / state.pairs;
      var every = share >= 0.5 ? 10 : 30;
      var swapping = state.moving && !state.won && share >= 0.25 &&
                     state.seconds % every === 0 && swapCards(share >= 0.75 ? 2 : 1);
      /* each player hears it when their own clock is half gone */
      if(state.moving && !state.won && !state.holding && state.clocks &&
         state.clocks[state.turn] * 2 === state.budget){
        var half = (state.players >= 2 ? "Player " + (state.turn + 1) + ", half" : "Half") +
                   " your time is gone!";
        live.textContent = swapping ? live.textContent + " " + half : half;
        var game = state;
        /* after the swoosh, if a swap lands on the same second */
        setTimeout(function(){ if(state === game && !game.won) sfx.half(); }, swapping ? 1900 : 0);
      }
    }, 1000);
  }

  /* Extra hard, more often the more pairs are found: two face-down cards (four near the end) get up and trade
     places, sliding past each other across the table, so what you remembered
     about them is no longer true. Only cards nobody is looking at move, and
     never two of the same animal - that would change nothing. One of the two
     is always a card that has been turned before, if there is one: moving a
     card nobody has seen takes nothing away from anybody. */
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  function swapCards(times){
    var moved = 0;
    for(var n = 0; n < (times || 1); n++) if(swapPair()) moved++;
    if(!moved) return false;
    sfx.swap();
    live.textContent = moved > 1 ? "Watch out! Four cards are swapping places."
                                 : "Watch out! Two cards are swapping places.";
    return true;
  }
  function swapPair(){
    var cards = board.querySelectorAll(".card");
    var free = state.deck.map(function(slot, i){ return i; }).filter(function(i){
      var el = cards[i];
      return el && !state.deck[i].matched && el.dataset.face === "down" &&
             !el.dataset.state && !el.dataset.moving;
    });
    free = shuffle(free);
    /* the first from the cards that have been seen, its partner from all the
       rest - two seen ones alone would only trade back and forth */
    var firsts = free.filter(function(i){ return state.deck[i].seen; }).concat(free);
    var a = null, b = null;
    for(var x = 0; x < firsts.length && b === null; x++)
      for(var y = 0; y < free.length; y++)
        if(free[y] !== firsts[x] && state.deck[firsts[x]].id !== state.deck[free[y]].id){ a = firsts[x]; b = free[y]; break; }
    if(b === null) return false;

    var game = state, elA = cards[a], elB = cards[b];

    function finish(){
      if(state !== game) return;
      /* the slots trade animals and the buttons trade faces; both are face
         down, so nothing seen changes as the cards settle into their new homes */
      var t = game.deck[a]; game.deck[a] = game.deck[b]; game.deck[b] = t;
      var innerA = elA.querySelector(".inner"), innerB = elB.querySelector(".inner");
      elA.appendChild(innerB); elB.appendChild(innerA);
      [elA, elB].forEach(function(el){
        el.getAnimations && el.getAnimations().forEach(function(an){ if(an.id === "swap") an.cancel(); });
        delete el.dataset.moving;
      });
    }

    elA.dataset.moving = elB.dataset.moving = "true";
    var ra = elA.getBoundingClientRect(), rb = elB.getBoundingClientRect();
    var dx = rb.left - ra.left, dy = rb.top - ra.top;
    if(reduceMotion.matches || !elA.animate){ setTimeout(finish, 900); return true; }

    /* each card bows out to its own side of the line between them, so the
       two pass each other instead of sliding through one another */
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var bow = Math.min(90, dist * 0.22);
    var nx = -dy / dist * bow, ny = dx / dist * bow;
    function path(fx, fy, sign){
      return [
        {transform: "translate(0,0) scale(1)", offset: 0},
        {transform: "translate(0,0) scale(1.1)", offset: 0.14},
        {transform: "translate(" + (fx / 2 + sign * nx) + "px," + (fy / 2 + sign * ny) + "px) scale(1.16)", offset: 0.55},
        {transform: "translate(" + fx + "px," + fy + "px) scale(1.06)", offset: 0.9},
        {transform: "translate(" + fx + "px," + fy + "px) scale(1)", offset: 1}
      ];
    }
    var opts = {duration: 1500, delay: 320, easing: "ease-in-out", fill: "forwards", id: "swap"};
    elA.animate(path(dx, dy, 1), opts);
    elB.animate(path(-dx, -dy, -1), opts);
    setTimeout(finish, opts.delay + opts.duration + 30);
    return true;
  }
  function stopClock(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    if(state) state.running = false;
  }

  /* The album: every dinosaur face up, nothing to match — just a look at the cards. */
  function openAlbum(){
    closeViewer();
    closeMap();
    stopTurn();
    stopClock();
    clearFlipTimer();
    lock = false;
    state = {
      mode: "album", pairs: state ? state.pairs : 10, players: state ? state.players : 1,
      keepTurn: state ? state.keepTurn : true, holding: false,
      timed: state ? state.timed : false, speedrun: state ? state.speedrun : false,
      clocks: null, timeout: null,
      deck: SPECIES.map(function(d){ return {id: d.id, matched: false}; }),
      found: [], scores: seatArray(0), turn: 0, won: false,
      sides: [{last: null, open: false}, {last: null, open: false}],
      seconds: 0, turns: 0, running: false
    };

    albumBtn.textContent = albumFromStart ? "Back to start" : "Back to game";
    barMapBtn.hidden = true;   /* the album has its own, beside the count */
