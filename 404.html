<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinomemory</title>
<style>body{margin:0; min-height:100vh; display:grid; place-items:center; background:#070B08; color:#F0E9D9; font:18px/1.5 system-ui,sans-serif}a{color:#F2AB3E}</style>
<script>
  /* A shared address like /dino-game/map/jurassic/ has no file of its own, so
     the host sends this page instead. It hands the view to the game as
     ?/map/jurassic/ and the game puts the address back the way it was. The
     words must match the ones in index.html. */
  (function(){
    var WORDS = ["fi", "en", "cards", "map", "picture"];
    var parts = location.pathname.split("/"), j = 0;
    while(j < parts.length && WORDS.indexOf(parts[j]) < 0) j++;
    /* one slash in front, never two: //elsewhere.com/ would send them to another site */
    var root = "/" + parts.slice(0, j).join("/").replace(/^[\/\\]+/, "");
    if(j < parts.length)
      location.replace(location.origin + root.replace(/\/?$/, "/") + "?/" + parts.slice(j).join("/") + location.hash);
  })();
</script>
<p>Nothing lives here. <a href="/">Back to the dinosaurs</a></p>
<script>
  /* on a project site the game sits in the first folder, not at the very top */
  var folder = location.pathname.split("/")[1];
  if(/\.github\.io$/.test(location.hostname) && folder) document.querySelector("a").href = "/" + folder + "/";
</script>
